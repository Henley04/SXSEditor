<!DOCTYPE html>
<html><body><pre id="log"></pre><script>
const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; console.log(msg); };

async function test() {
    log(`Electron: ${navigator.userAgent.match(/Electron\/([\d.]+)/)?.[1] || 'N/A'}`);

    // Load ORT
    const script = document.createElement('script');
    script.src = '../node_modules/onnxruntime-web/dist/ort.min.js';
    document.head.appendChild(script);
    await new Promise(r => script.onload = r);

    ort.env.wasm.numThreads = Math.max(1, Math.min(navigator.hardwareConcurrency || 4, 8));

    const modelPath = '../onnx_models/int8/optimized_npu/w8a8_test/preflow_w8a8.onnx';

    // Try loading with webnn EP
    for (const ep of ['webnn', 'wasm']) {
        try {
            log(`\nTrying EP: ${ep}...`);
            const session = await ort.InferenceSession.create(modelPath, {
                executionProviders: [{ name: ep, deviceType: ep === 'webnn' ? 'npu' : undefined }].filter(Boolean),
                graphOptimizationLevel: 'all',
            });
            log(`  Loaded with ${ep}`);

            // Create dummy input
            const inputs = {};
            for (const inp of session.inputNames) {
                // preflow inputs: [1, 2048, 512] float32
                inputs[inp] = new ort.Tensor('float32', new Float32Array(2048 * 512), [1, 2048, 512]);
            }
            const t0 = performance.now();
            const results = await session.run(inputs);
            const ms = (performance.now() - t0).toFixed(0);
            const outName = Object.keys(results)[0];
            log(`  Inference OK (${ms}ms), output: ${results[outName].dims}`);
            session.release();
            break;
        } catch (e) {
            log(`  FAIL: ${e.message}`);
        }
    }
}
test();
</script></body></html>
