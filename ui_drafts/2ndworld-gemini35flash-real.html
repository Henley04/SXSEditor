<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SXSEditor - Cyber Divas Edition</title>
    <script src="./themes/themeBootstrap.js"></script>
    <style>
      /* ==================== 二次元赛博歌姬主题核心变量 ==================== */
      :root {
        /* 深邃电子/机甲底色 */
        --bg-app: #080914;
        --bg-elevated: #0f1122;
        --bg-toolbar-start: #14172e;
        --bg-toolbar-end: #0a0b16;
        --bg-header-start: #181c36;
        --bg-header-end: #0f1122;
        --bg-input: #04050a;
        
        /* 经典虚拟歌姬主音色（天青霓虹/歌姬绿） */
        --accent: #00f3ff;
        --accent-soft: rgba(0, 243, 255, 0.15);
        --accent-softer: rgba(0, 243, 255, 0.04);
        --accent-line-strong: rgba(0, 243, 255, 0.4);
        --accent-glow-strong: rgba(0, 243, 255, 0.8);
        
        /* 极客情感副色（电音霓虹粉/BPM心跳） */
        --secondary-accent: #ff007f;
        --secondary-soft: rgba(255, 0, 127, 0.15);
        --secondary-glow: rgba(255, 0, 127, 0.6);

        /* 文本前景色 - 高对比、易读 */
        --fg-primary: #e2e8f0;
        --fg-muted: #8fa0ba;
        --fg-toolbar-hover: #00f3ff;
        --fg-time: #00f3ff;
        --fg-bpm: #ff007f;
        --fg-on-accent: #04050a;

        /* 科技感边框与阴影 */
        --border-subtle: #1e2243;
        --color-gray-900: #121428;
        --color-gray-800: #2d325a;
        --color-gray-700: #414984;
        --color-gray-600: #64748b;
        --color-gray-500: #94a3b8;
        
        /* 按钮状态 */
        --bg-button: #181c38;
        --bg-button-hover: #222852;
        --bg-button-active: #00f3ff;
        --bg-button-primary: #ff007f;
        --bg-singer-active: rgba(0, 243, 255, 0.06);

        --shadow-color: rgba(0, 0, 0, 0.6);
        --shadow-color-mid: rgba(0, 0, 0, 0.8);
        --shadow-sm: 0 4px 12px rgba(0,0,0,0.5);
        
        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-full: 9999px;
        
        /* 动画阻尼 */
        --motion-fast: 0.15s;
        --motion-slow: 0.4s;
        
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-8: 32px;
        
        --font-xs: 11px;
        --font-sm: 12px;
        --font-base: 13px;
        --font-lg: 16px;
        
        --danger: #ff4a70;
        --danger-glow: rgba(255, 74, 112, 0.4);
        --bg-button-danger: #3b1420;
        --bg-button-danger-hover: #5c182c;
      }

      /* ==================== 基础与布局重构 ==================== */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-app);
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
        color: var(--fg-primary);
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(var(--color-gray-900) 1px, transparent 1px);
        background-size: 24px 24px; /* 全局科技感微点阵背景 */
      }

      /* 自定义美化滚动条 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-app);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-gray-800);
        border-radius: var(--radius-sm);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
      }

      /* ==================== 工具栏（机甲操作舱风格） ==================== */
      #toolbar {
        display: flex;
        align-items: center;
        height: 48px;
        min-height: 48px;
        padding: 0 16px;
        background: linear-gradient(180deg, var(--bg-toolbar-start) 0%, var(--bg-toolbar-end) 100%);
        color: var(--fg-primary);
        border-bottom: 2px solid var(--color-gray-900);
        gap: var(--space-2);
        box-shadow: var(--shadow-sm);
        position: relative;
        z-index: 10;
      }
      
      /* 工具栏上方的霓虹饰条 */
      #toolbar::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent) 0%, var(--secondary-accent) 50%, var(--accent) 100%);
        box-shadow: 0 1px 8px var(--accent);
      }

      .toolbar-group {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .toolbar-divider {
        width: 2px;
        height: 20px;
        background: linear-gradient(180deg, transparent, var(--color-gray-700), transparent);
        margin: 0 var(--space-2);
        flex-shrink: 0;
      }

      /* 按钮科幻化重塑 */
      #toolbar button {
        background: var(--bg-button);
        color: var(--fg-muted);
        border: 1px solid var(--color-gray-800);
        border-radius: var(--radius-sm);
        padding: 5px var(--space-4);
        cursor: pointer;
        font-size: var(--font-base);
        font-weight: 500;
        transition: all var(--motion-fast) ease-image, border-color var(--motion-fast), color var(--motion-fast), box-shadow var(--motion-fast);
        white-space: nowrap;
        position: relative;
      }

      #toolbar button:hover {
        background: var(--bg-button-hover);
        color: var(--fg-toolbar-hover);
        border-color: var(--accent);
        box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
      }

      /* 播放系列按钮特殊高亮 */
      #btn-play:hover {
        color: var(--accent) !important;
        box-shadow: 0 0 10px var(--accent-glow-strong) !important;
      }
      #btn-pause:hover { color: #ffcc00 !important; }
      #btn-stop:hover { color: var(--danger) !important; }

      /* AI与导出等关键操作按钮使用霓虹粉 */
      #btn-audio-to-midi, #btn-export {
        border-color: rgba(255, 0, 127, 0.4) !important;
      }
      #btn-audio-to-midi:hover, #btn-export:hover {
        background: var(--secondary-soft) !important;
        color: var(--secondary-accent) !important;
        border-color: var(--secondary-accent) !important;
        box-shadow: 0 0 10px var(--secondary-glow) !important;
      }

      #toolbar button:active {
        transform: scale(0.96);
      }

      #toolbar button:disabled {
        opacity: 0.25;
        cursor: not-allowed;
        box-shadow: none !important;
        border-color: var(--color-gray-900) !important;
      }

      /* 核心时钟显示（EVA数字矩阵风） */
      #time-display {
        font-family: 'Consolas', 'Courier New', monospace;
        font-variant-numeric: tabular-nums;
        font-size: 18px;
        font-weight: bold;
        color: var(--fg-time);
        background: var(--bg-input);
        padding: 4px var(--space-4);
        border-radius: var(--radius-sm);
        border: 1px solid var(--accent-line-strong);
        min-width: 110px;
        text-align: center;
        letter-spacing: 1px;
        text-shadow: 0 0 6px var(--accent);
        box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
      }

      /* 输入框数字化控制面板 */
      #toolbar input[type="number"] {
        width: 52px;
        background: var(--bg-input);
        color: var(--fg-primary);
        border: 1px solid var(--color-gray-800);
        border-radius: var(--radius-sm);
        padding: var(--space-1) var(--space-2);
        text-align: center;
        font-size: var(--font-base);
        font-family: 'Consolas', monospace;
        transition: all var(--motion-fast);
      }

      #toolbar input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 8px var(--accent-soft);
      }

      /* BPM心跳专属高亮 */
      #bpm-input {
        color: var(--fg-bpm) !important;
        border-color: rgba(255, 0, 127, 0.3) !important;
        background: rgba(255, 0, 127, 0.03) !important;
        font-weight: bold;
      }
      #bpm-input:focus {
        border-color: var(--secondary-accent) !important;
        box-shadow: 0 0 8px var(--secondary-soft) !important;
      }

      #toolbar label {
        font-size: var(--font-sm);
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        gap: var(--space-1);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* 复选框美化 */
      #toolbar input[type="checkbox"] {
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* ==================== 主内容区 ==================== */
      #main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ==================== 歌手面板（虚拟偶像角色库风格） ==================== */
      #singer-panel {
        width: 250px;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        background: var(--bg-elevated);
        color: var(--fg-muted);
        border-right: 2px solid var(--color-gray-900);
      }

      #singer-panel-header, #fragment-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 38px;
        min-height: 38px;
        padding: 0 14px;
        background: linear-gradient(90deg, var(--bg-header-start) 0%, var(--bg-header-end) 100%);
        border-bottom: 1px solid var(--border-subtle);
        font-size: var(--font-xs);
        font-weight: bold;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        position: relative;
      }
      
      /* 分区标题左侧前缀微章 */
      #singer-panel-header::before, #fragment-header::before {
        content: '■';
        font-size: 8px;
        margin-right: 6px;
        color: var(--secondary-accent);
        text-shadow: 0 0 4px var(--secondary-accent);
      }

      #btn-add-singer {
        width: 20px;
        height: 20px;
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent-line-strong);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: all var(--motion-fast);
      }

      #btn-add-singer:hover {
        background: var(--accent);
        color: var(--fg-on-accent);
        box-shadow: 0 0 8px var(--accent);
      }

      #singer-list {
        flex: 1;
        overflow-y: auto;
        padding: var(--space-1) 0;
      }

      /* 空歌手状态插画风美化 */
      .singer-item-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        padding: var(--space-5) 12px;
        cursor: pointer;
        color: var(--color-gray-600);
        border: 1px dashed var(--color-gray-800);
        margin: var(--space-3);
        border-radius: var(--radius-md);
        transition: all var(--motion-fast);
      }

      .singer-item-empty:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-softer);
      }

      .singer-avatar-empty {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        border: 2px dashed var(--color-gray-700);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--motion-fast);
      }

      .singer-item-empty:hover .singer-avatar-empty {
        border-color: var(--accent);
      }

      .singer-empty-text {
        font-size: var(--font-sm);
      }

      /* 正常状态下的歌手轨道条 */
      .singer-item {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        padding: 0 12px;
        height: 74px;
        border-bottom: 1px solid var(--color-gray-900);
        cursor: pointer;
        transition: all var(--motion-fast);
        background: linear-gradient(90deg, rgba(20,23,46,0.3) 0%, transparent 100%);
      }

      .singer-item:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      /* 选中轨道激活态：初音炫绿边缘与微光背景 */
      .singer-item.active {
        background: var(--bg-singer-active);
        border-left: 4px solid var(--accent);
        padding-left: 8px;
        box-shadow: inset 4px 0 12px rgba(0, 243, 255, 0.05);
      }

      /* 歌手头像外框装饰 */
      .singer-avatar {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-sm);
        background: var(--bg-input);
        border: 1px solid var(--color-gray-700);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        transition: border-color var(--motion-fast);
      }

      .singer-item.active .singer-avatar {
        border-color: var(--accent);
        box-shadow: 0 0 6px var(--accent-soft);
      }

      .singer-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .singer-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .singer-track-name {
        font-size: var(--font-base);
        font-weight: bold;
        color: var(--fg-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .singer-singer-name {
        font-size: var(--font-xs);
        color: var(--accent);
        opacity: 0.8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .singer-config {
        font-size: 10px;
        font-family: monospace;
        color: var(--color-gray-600);
        text-transform: uppercase;
      }

      /* 报错/文件丢失警告 - 醒目霓虹红 */
      .singer-file-missing-warning {
        font-size: var(--font-xs);
        color: var(--danger);
        font-weight: bold;
        text-shadow: 0 0 4px var(--danger-glow);
      }

      .btn-relocate-singer {
        font-size: 10px;
        color: #fff;
        background: var(--danger);
        border: none;
        border-radius: var(--radius-sm);
        padding: 2px 6px;
        cursor: pointer;
        transition: background var(--motion-fast);
      }
      .btn-relocate-singer:hover {
        background: #ff2a55;
        box-shadow: 0 0 6px var(--danger-glow);
      }

      /* 轨道互动按钮组 */
      .singer-item-actions {
        display: flex;
        flex-direction: column;
        gap: 4px;
        opacity: 0.5;
        transition: opacity var(--motion-fast);
      }
      .singer-item:hover .singer-item-actions, .singer-item.active .singer-item-actions {
        opacity: 1;
      }

      .btn-fragment-add, .btn-singer-delete {
        width: 18px;
        height: 18px;
        background: var(--bg-button);
        color: var(--fg-muted);
        border: 1px solid var(--color-gray-800);
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--motion-fast);
      }

      .btn-fragment-add:hover {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 6px var(--accent-soft);
      }

      .btn-singer-delete:hover {
        border-color: var(--danger);
        color: var(--danger);
        box-shadow: 0 0 6px var(--danger-glow);
      }

      /* ==================== 分片时间轴与主工作区 ==================== */
      #fragment-timeline {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg-app);
        overflow: hidden;
      }

      /* 右侧面板心跳BPM徽章 */
      #bpm-display-badge {
        font-size: var(--font-sm);
        font-weight: bold;
        font-family: 'Consolas', monospace;
        color: var(--secondary-accent);
        background: rgba(255, 0, 127, 0.08);
        border: 1px solid rgba(255, 0, 127, 0.4);
        border-radius: var(--radius-sm);
        padding: 2px 8px;
        letter-spacing: 0.5px;
        text-shadow: 0 0 4px var(--secondary-glow);
      }

      #fragment-canvas-container {
        flex: 1;
        overflow: hidden;
        position: relative;
        background-color: #05060c; /* 比外部稍微更暗，突出波形/时间轴分片 */
      }
      
      /* 给时间轴加一条微妙的纵向网格纹理 */
      #fragment-canvas-container::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
        background-size: 100% 40px;
        pointer-events: none;
      }

      #fragment-canvas {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
      }

      #fragment-playhead-canvas {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 2;
      }

      /* 版本号胶囊微章 */
      .version-badge {
        font-family: monospace;
        font-size: var(--font-xs);
        color: var(--color-gray-600);
        background: var(--bg-input);
        padding: 2px 8px;
        border-radius: var(--radius-full);
        border: 1px solid var(--color-gray-900);
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-play" data-i18n="main.play">▶ 播放</button>
          <button id="btn-pause" data-i18n="main.pause">⏸ 暂停</button>
          <button id="btn-stop" data-i18n="main.stop">⏹ 停止</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span id="time-display">00:00:000</span>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <label>BPM <input id="bpm-input" type="number" value="120" min="1" max="999" /></label>
          <label data-i18n="main.timeSignature">拍号 <input id="time-sig-num" type="number" value="4" min="1" max="32" /> / <input id="time-sig-den" type="number" value="4" min="1" max="32" /></label>
          <label><input type="checkbox" id="auto-shift-check" checked />Auto Shift</label>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-save" data-i18n="main.save">💾 保存</button>
          <button id="btn-load" data-i18n="main.load">📂 加载</button>
          <button id="btn-export" data-i18n="main.export">📤 导出</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-audio-to-midi" data-i18n="main.audioToMidi">🎵 音频转MIDI</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span id="version-display" class="version-badge">v-</span>
        </div>
      </div>

      <div id="main-content">
        <div id="singer-panel">
          <div id="singer-panel-header">
            <span data-i18n="main.singer">歌手库 / TRACKS</span>
            <button id="btn-add-singer" aria-label="添加">+</button>
          </div>
          <div id="singer-list" role="list">
            </div>
        </div>

        <div id="fragment-timeline">
          <div id="fragment-header">
            <span data-i18n="main.fragmentTimeline">分片时间轴控制台</span>
            <span id="bpm-display-badge">♩ 120 BPM</span>
          </div>
          <div id="fragment-canvas-container">
            <canvas id="fragment-canvas" role="img" aria-label="分片时间轴"></canvas>
            <canvas id="fragment-playhead-canvas" role="img" aria-label="播放指针"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script src="./ort.all.min.js"></script>
  </body>
</html>
