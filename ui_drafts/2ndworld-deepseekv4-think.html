<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ 星咏歌姬 · Hoshine Utau ✦ 虚拟歌姬宿主</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #1f1f35;
            --bg-tertiary: #252540;
            --bg-panel: #1e1e33;
            --bg-piano-roll: #1c1c30;
            --text-primary: #e8e0f0;
            --text-secondary: #c5b8d9;
            --text-muted: #9085a8;
            --accent-pink: #f08cb4;
            --accent-purple: #b38cd9;
            --accent-blue: #7eb8e0;
            --accent-cyan: #6ed4cf;
            --accent-coral: #f4a0a0;
            --accent-lavender: #c9a8e8;
            --border-subtle: #332d45;
            --border-medium: #443d58;
            --shadow-glow-pink: 0 0 18px rgba(240, 140, 180, 0.25);
            --shadow-glow-purple: 0 0 18px rgba(179, 140, 217, 0.25);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --font-main: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
            --font-display: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: #141420;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            background-image:
                radial-gradient(ellipse at 25% 20%, rgba(240, 140, 180, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 60%, rgba(179, 140, 217, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(126, 184, 224, 0.04) 0%, transparent 50%);
        }

        /* 主容器 */
        .daw-container {
            width: 1300px;
            height: 820px;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow:
                0 8px 50px rgba(0, 0, 0, 0.55),
                0 0 0 1px var(--border-subtle),
                0 0 60px rgba(180, 130, 210, 0.1);
            position: relative;
        }

        /* 装饰性粒子背景 */
        .particles-bg {
            position: absolute;
            pointer-events: none;
            inset: 0;
            z-index: 0;
            opacity: 0.35;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.15;
            }
            100% {
                transform: translateY(-820px) translateX(40px) scale(0.3);
                opacity: 0;
            }
        }

        /* 顶部标题栏 */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 5;
            flex-shrink: 0;
            gap: 14px;
        }
        .title-bar .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 14px rgba(240, 140, 180, 0.45);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,
            100% {
                box-shadow: 0 0 14px rgba(240, 140, 180, 0.45);
            }
            50% {
                box-shadow: 0 0 26px rgba(200, 140, 220, 0.7);
            }
        }
        .logo-text {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f8c0d8, #d0b0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .title-bar .menu-tabs {
            display: flex;
            gap: 4px;
        }
        .menu-tab {
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition-fast);
            letter-spacing: 0.5px;
            border: 1px solid transparent;
            background: transparent;
            font-family: inherit;
        }
        .menu-tab:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            border-color: var(--border-medium);
        }
        .menu-tab.active {
            background: rgba(240, 140, 180, 0.13);
            color: var(--accent-pink);
            border-color: rgba(240, 140, 180, 0.35);
            box-shadow: 0 0 10px rgba(240, 140, 180, 0.12);
        }
        .title-bar .window-controls {
            display: flex;
            gap: 8px;
        }
        .win-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition-fast);
            opacity: 0.8;
        }
        .win-dot:hover {
            opacity: 1;
            transform: scale(1.2);
        }
        .win-dot.red {
            background: #f06b7d;
        }
        .win-dot.yellow {
            background: #f0c06b;
        }
        .win-dot.green {
            background: #6bd4a0;
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            z-index: 2;
            position: relative;
        }

        /* 左侧面板 - 歌姬&音轨 */
        .left-panel {
            width: 240px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 3;
        }
        /* 歌姬角色卡 */
        .character-card {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            background: linear-gradient(180deg, rgba(240, 140, 180, 0.06) 0%, transparent 100%);
        }
        .character-avatar-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }
        .character-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #3a2a45, #2a1f38);
            border: 3px solid var(--accent-lavender);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: var(--shadow-glow-purple);
            position: relative;
            transition: var(--transition-smooth);
        }
        .character-avatar:hover {
            box-shadow: 0 0 30px rgba(200, 150, 230, 0.5);
            border-color: #d4b8f0;
        }
        .avatar-sparkle {
            position: absolute;
            font-size: 16px;
            animation: sparkleFloat 2s ease-in-out infinite;
        }
        .avatar-sparkle.s1 {
            top: -4px;
            right: 4px;
            animation-delay: 0s;
        }
        .avatar-sparkle.s2 {
            bottom: 2px;
            left: -2px;
            animation-delay: 0.7s;
        }
        .avatar-sparkle.s3 {
            top: 10px;
            left: -10px;
            animation-delay: 1.4s;
            font-size: 11px;
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-6px) scale(1.3);
                opacity: 1;
            }
        }
        .character-name {
            font-weight: 700;
            font-size: 14px;
            color: #e8d5f5;
            letter-spacing: 1px;
            font-family: var(--font-display);
        }
        .character-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        .voice-bank-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 10px;
            color: var(--accent-cyan);
            background: rgba(110, 212, 207, 0.08);
            border-radius: 12px;
            padding: 4px 10px;
            display: inline-flex;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid transparent;
        }
        .voice-bank-info:hover {
            border-color: rgba(110, 212, 207, 0.35);
            background: rgba(110, 212, 207, 0.14);
        }
        .voice-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: voiceDotPulse 1.8s ease-in-out infinite;
        }
        @keyframes voiceDotPulse {
            0%,
            100% {
                box-shadow: 0 0 4px var(--accent-cyan);
            }
            50% {
                box-shadow: 0 0 12px var(--accent-cyan), 0 0 20px rgba(110, 212, 207, 0.5);
            }
        }

        /* 音轨列表 */
        .track-list-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .track-list-header {
            padding: 10px 14px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-track-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(240, 140, 180, 0.2);
            border: 1px solid rgba(240, 140, 180, 0.3);
            color: var(--accent-pink);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            line-height: 1;
        }
        .add-track-btn:hover {
            background: rgba(240, 140, 180, 0.35);
            box-shadow: 0 0 10px rgba(240, 140, 180, 0.25);
        }
        .track-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition-fast);
            border-left: 3px solid transparent;
            margin: 1px 0;
        }
        .track-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .track-item.active {
            background: rgba(240, 140, 180, 0.1);
            border-left-color: var(--accent-pink);
        }
        .track-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .track-color-dot.c1 {
            background: #f08cb4;
        }
        .track-color-dot.c2 {
            background: #b38cd9;
        }
        .track-color-dot.c3 {
            background: #7eb8e0;
        }
        .track-item .track-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .track-item .track-singer {
            font-size: 10px;
            color: var(--text-muted);
        }
        .track-mute,
        .track-solo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-size: 9px;
            cursor: pointer;
            border: 1px solid var(--border-medium);
            background: transparent;
            color: var(--text-muted);
            transition: var(--transition-fast);
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: inherit;
        }
        .track-mute:hover,
        .track-solo:hover {
            border-color: #888;
            color: #ddd;
        }
        .track-mute.muted {
            background: #f06b7d33;
            border-color: #f06b7d;
            color: #f06b7d;
        }
        .track-solo.soloed {
            background: #f0c06b33;
            border-color: #f0c06b;
            color: #f0c06b;
        }

        /* 中央编辑区 */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-piano-roll);
            overflow: hidden;
        }
        /* 工具栏 */
        .editor-toolbar {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            gap: 8px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-tertiary);
            flex-shrink: 0;
        }
        .tool-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-medium);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition-fast);
            font-family: inherit;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: #666;
            color: #fff;
        }
        .tool-btn.active-tool {
            background: rgba(240, 140, 180, 0.18);
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            box-shadow: 0 0 8px rgba(240, 140, 180, 0.15);
        }
        .tool-separator {
            width: 1px;
            height: 18px;
            background: var(--border-medium);
            margin: 0 4px;
        }
        .quantize-select {
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border-medium);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition-fast);
        }
        .quantize-select:hover {
            border-color: #777;
        }

        /* 钢琴卷帘 */
        .piano-roll-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .piano-keys {
            width: 60px;
            flex-shrink: 0;
            background: var(--bg-tertiary);
            border-right: 1px solid var(--border-subtle);
            overflow-y: hidden;
            position: relative;
            z-index: 2;
        }
        .piano-key {
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 9px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }
        .piano-key:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ddd;
        }
        .piano-key.black-key {
            background: #252535;
            color: #666;
            font-size: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.3);
        }
        .piano-key.black-key:hover {
            background: #2e2e40;
        }
        .piano-key.highlight-key {
            background: rgba(240, 140, 180, 0.2);
            color: #f8c0d8;
        }
        .roll-canvas-wrapper {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--bg-piano-roll);
        }
        .roll-canvas-inner {
            position: relative;
            width: 2400px;
            height: 1056px;
            /* 48个半音 * 22px */;
        }
        .roll-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .grid-row {
            position: absolute;
            left: 0;
            right: 0;
            height: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.025);
        }
        .grid-row.beat-line {
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .grid-row.bar-line {
            border-bottom: 1px solid rgba(240, 140, 180, 0.2);
        }
        .grid-col {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.03);
        }
        .grid-col.beat-col {
            background: rgba(255, 255, 255, 0.07);
        }
        .grid-col.bar-col {
            background: rgba(240, 140, 180, 0.22);
            width: 2px;
        }
        /* 音符 */
        .note-block {
            position: absolute;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: filter 0.1s, box-shadow 0.1s;
            z-index: 3;
            min-width: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .note-block:hover {
            filter: brightness(1.3);
            box-shadow: 0 0 14px rgba(240, 180, 200, 0.5);
            z-index: 10;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .note-block.selected-note {
            border: 2px solid #fff !important;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5) !important;
            z-index: 11;
        }
        .note-block .note-lyric {
            position: absolute;
            top: 1px;
            left: 4px;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.85);
            pointer-events: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #fff;
            z-index: 8;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 30px rgba(240, 140, 180, 0.5);
            transition: left 0.05s linear;
        }
        .time-ruler {
            height: 24px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            padding-left: 60px;
            font-size: 9px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            flex-shrink: 0;
            gap: 0;
            overflow: hidden;
        }
        .time-ruler span {
            position: absolute;
            font-family: var(--font-mono);
        }

        /* 右侧参数面板 */
        .right-panel {
            width: 220px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 3;
            overflow-y: auto;
        }
        .param-section {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .param-section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .param-section-title .param-icon {
            font-size: 13px;
        }
        .param-group {
            margin-bottom: 10px;
        }
        .param-label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .param-value {
            color: var(--accent-pink);
            font-weight: 600;
            font-family: var(--font-mono);
            font-size: 10px;
        }
        .param-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
            outline: none;
            cursor: pointer;
        }
        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent-pink);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(240, 140, 180, 0.4);
            transition: var(--transition-fast);
        }
        .param-slider::-webkit-slider-thumb:hover {
            box-shadow: 0 0 16px rgba(240, 140, 180, 0.7);
            transform: scale(1.1);
        }
        .preset-btn {
            width: 100%;
            padding: 8px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-medium);
            background: rgba(240, 140, 180, 0.06);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition-fast);
            font-family: inherit;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .preset-btn:hover {
            background: rgba(240, 140, 180, 0.16);
            border-color: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 8px rgba(240, 140, 180, 0.15);
        }
        .preset-btn.active-preset {
            background: rgba(240, 140, 180, 0.22);
            border-color: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 12px rgba(240, 140, 180, 0.25);
        }

        /* 底部控制栏 */
        .bottom-bar {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            gap: 10px;
            flex-shrink: 0;
            z-index: 5;
        }
        .transport-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .transport-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border-medium);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 15px;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .transport-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #888;
        }
        .transport-btn.play-btn {

            font-family: var(--font-mono);

        .lyric-input-area {

        .lyric-input {

            font-size: 13px;

            transition: var(--transition-fast);
            letter-spacing: 1px;
        }
        .lyric-input:focus {
            outline: none;
            border-color: var(--accent-pink);

        .lyric-input::placeholder {

        /* 滚动条 */

    </style>
</head>
<body>

        <!-- 主内容区 -->

            <!-- 左侧面板 -->

                    <button class="preset-btn" data-preset="soft">🌙 轻柔</button>
                    <button class="preset-btn" data-preset="power">🔥 强力</button>
                    <button class="preset-btn" data-preset="cute">🍬 可爱</button>
                    <button class="preset-btn" data-preset="dark">🖤 低沉</button>
                </div>
                <div class="param-section">
                    <div class="param-section-title"><span class="param-icon">📝</span> 选中音符信息</div>
                    <div style="font-size:10px;color:var(--text-muted);" id="selectedNoteInfo">点击音符查看详情</div>
                    <div style="font-size:10px;color:var(--accent-cyan);margin-top:4px;font-family:var(--font-mono);" id="selectedNoteDetail"></div>
                </div>

        <!-- 底部控制栏 -->
        <div class="bottom-bar">
            <div class="transport-controls">
                <button class="transport-btn" title="跳到开始">⏮️</button>

            </div>

                <span>🎵 BPM</span>
                <input type="number" value="140" min="40" max="300" id="bpmInput">
            </div>
            <div class="lyric-input-area">
                <input type="text" class="lyric-input" placeholder="输入歌词... 例如: さくら さくら" id="lyricInput">
                <button class="insert-lyric-btn" id="insertLyricBtn">📝 填入选中音符</button>
            </div>

        <!-- Toast提示 -->
        <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ DOM引用 ============
            const rollCanvasInner = document.getElementById('rollCanvasInner');
            const rollCanvasWrapper = document.getElementById('rollCanvasWrapper');
            const rollGrid = document.getElementById('rollGrid');
            const pianoKeys = document.getElementById('pianoKeys');
            const timeRuler = document.getElementById('timeRuler');
            const playhead = document.getElementById('playhead');
            const playBtn = document.getElementById('playBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const bpmInput = document.getElementById('bpmInput');
            const lyricInput = document.getElementById('lyricInput');
            const insertLyricBtn = document.getElementById('insertLyricBtn');
            const toast = document.getElementById('toast');
            const selectedNoteInfo = document.getElementById('selectedNoteInfo');
            const selectedNoteDetail = document.getElementById('selectedNoteDetail');
            const clearNotesBtn = document.getElementById('clearNotesBtn');
            const quantizeBtn = document.getElementById('quantizeBtn');
            const quantizeSelect = document.getElementById('quantizeSelect');
            const particlesBg = document.getElementById('particlesBg');

            // 参数滑块
            const breathSlider = document.getElementById('breathSlider');
            const velocitySlider = document.getElementById('velocitySlider');
            const vibratoSlider = document.getElementById('vibratoSlider');
            const claritySlider = document.getElementById('claritySlider');
            const tensionSlider = document.getElementById('tensionSlider');

            // ============ 常量 ============
            const ROW_HEIGHT = 22;
            const TOTAL_SEMITONES = 48; // 4个八度
            const PIXELS_PER_BEAT = 80; // 每拍像素(16分音符=20px)
            const NOTE_MIN_WIDTH = 8;
            const TOTAL_BEATS = 30; // 总共30拍
            const CANVAS_WIDTH = TOTAL_BEATS * PIXELS_PER_BEAT; // 2400px
            const CANVAS_HEIGHT = TOTAL_SEMITONES * ROW_HEIGHT; // 1056px

            // 音符数据
            let notes = [];
            let selectedNoteId = null;
            let currentTool = 'pencil';
            let isPlaying = false;
            let playheadPosition = 80; // 像素位置
            let animationId = null;
            let lastFrameTime = null;
            let bpm = 140;
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let dragNoteId = null;
            let dragNoteOrigX = 0;
            let dragNoteOrigRow = 0;
            let noteIdCounter = 0;

            // 音符颜色
            const noteColors = [
                'linear-gradient(135deg, #f08cb4, #e8709a)',
                'linear-gradient(135deg, #b38cd9, #9a6ec8)',
                'linear-gradient(135deg, #7eb8e0, #5ea0d0)',
                'linear-gradient(135deg, #f4a0a0, #e88080)',
                'linear-gradient(135deg, #6ed4cf, #4eb8b4)',
                'linear-gradient(135deg, #c9a8e8, #b088d8)',
            ];

            // MIDI音符名
            const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const baseOctave = 3;

            // ============ 初始化钢琴键 ============
            function initPianoKeys() {
                pianoKeys.innerHTML = '';
                for (let i = TOTAL_SEMITONES - 1; i >= 0; i--) {
                    const midiNote = 60 + i; // C4 = 60
                    const noteName = noteNames[midiNote % 12];
                    const octave = Math.floor(midiNote / 12) - 1;
                    const isBlack = noteName.includes('#');
                    const key = document.createElement('div');
                    key.className = 'piano-key' + (isBlack ? ' black-key' : '');
                    key.textContent = noteName + octave;
                    key.style.height = ROW_HEIGHT + 'px';
                    key.style.lineHeight = ROW_HEIGHT + 'px';
                    key.dataset.row = i;
                    key.addEventListener('click', () => {
                        // 点击钢琴键可以预览音高(高亮)
                        document.querySelectorAll('.piano-key').forEach(k => k.classList.remove(
                            'highlight-key'));
                        key.classList.add('highlight-key');
                        setTimeout(() => key.classList.remove('highlight-key'), 400);
                        showToast('🎹 音高: ' + noteName + octave + ' (MIDI ' + midiNote + ')');
                    });
                    pianoKeys.appendChild(key);
                }
            }

            // ============ 初始化时间标尺 ============
            function initTimeRuler() {
                timeRuler.innerHTML = '';
                for (let beat = 0; beat <= TOTAL_BEATS; beat++) {
                    const x = beat * PIXELS_PER_BEAT + 60; // 60是钢琴键宽度偏移
                    const marker = document.createElement('span');
                    marker.style.left = x + 'px';
                    marker.textContent = (beat + 1);
                    marker.style.position = 'absolute';
                    marker.style.transform = 'translateX(-50%)';
                    marker.style.top = '4px';
                    timeRuler.appendChild(marker);
                }
            }

            // ============ 初始化网格 ============
            function initGrid() {
                rollGrid.innerHTML = '';
                // 水平线
                for (let i = 0; i <= TOTAL_SEMITONES; i++) {
                    const row = document.createElement('div');
                    row.className = 'grid-row';
                    if (i % 12 === 0) row.classList.add('bar-line');
                    else if (i % 4 === 0) row.classList.add('beat-line');
                    row.style.top = (i * ROW_HEIGHT) + 'px';
                    rollGrid.appendChild(row);
                }
                // 垂直线
                for (let beat = 0; beat <= TOTAL_BEATS; beat++) {
                    const col = document.createElement('div');
                    col.className = 'grid-col';
                    if (beat % 4 === 0) col.classList.add('bar-col');
                    else if (beat % 1 === 0) col.classList.add('beat-col');
                    col.style.left = (beat * PIXELS_PER_BEAT) + 'px';
                    rollGrid.appendChild(col);
                }
            }

            // ============ 渲染音符 ============
            function renderNotes() {
                // 清除旧音符DOM
                const oldNotes = rollCanvasInner.querySelectorAll('.note-block');
                oldNotes.forEach(n => n.remove());

                notes.forEach(note => {
                    const noteEl = document.createElement('div');
                    noteEl.className = 'note-block';
                    if (note.id === selectedNoteId) {
                        noteEl.classList.add('selected-note');
                    }
                    noteEl.style.left = note.x + 'px';
                    noteEl.style.top = (note.row * ROW_HEIGHT + 1) + 'px';
                    noteEl.style.width = Math.max(note.width, NOTE_MIN_WIDTH) + 'px';
                    noteEl.style.height = (ROW_HEIGHT - 2) + 'px';
                    noteEl.style.background = note.color || noteColors[note.row % noteColors.length];
                    noteEl.dataset.noteId = note.id;
                    noteEl.title = '音符: ' + note.lyric + ' | 音高行: ' + note.row + ' | 拖拽移动';

                    // 歌词标签
                    if (note.lyric && note.lyric !== '♪') {
                        const lyricSpan = document.createElement('span');
                        lyricSpan.className = 'note-lyric';
                        lyricSpan.textContent = note.lyric;
                        noteEl.appendChild(lyricSpan);
                    }

                    // 事件
                    noteEl.addEventListener('mousedown', (e) => onNoteMouseDown(e, note));
                    noteEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        deleteNote(note.id);
                    });

                    rollCanvasInner.appendChild(noteEl);
                });
                updatePlayhead();
            }

            // ============ 音符鼠标事件 ============
            function onNoteMouseDown(e, note) {
                if (currentTool === 'eraser') {
                    deleteNote(note.id);
                    return;
                }
                if (currentTool === 'select' || currentTool === 'pencil') {
                    e.stopPropagation();
                    selectNote(note.id);
                    isDragging = true;
                    dragNoteId = note.id;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    dragNoteOrigX = note.x;
                    dragNoteOrigRow = note.row;
                }
            }

            function selectNote(id) {
                selectedNoteId = id;
                const note = notes.find(n => n.id === id);
                if (note) {
                    const midiNote = 60 + note.row;
                    const noteName = noteNames[midiNote % 12];
                    const octave = Math.floor(midiNote / 12) - 1;
                    selectedNoteInfo.textContent = '🎵 ' + noteName + octave + ' (行' + note.row + ')';
                    selectedNoteDetail.textContent = '歌词: ' + (note.lyric || '♪') + ' | 长度: ' + Math.round(note
                        .width / PIXELS_PER_BEAT * 16) + ' ticks';
                }
                renderNotes();
            }

            function deleteNote(id) {
                notes = notes.filter(n => n.id !== id);
                if (selectedNoteId === id) {
                    selectedNoteId = null;
                    selectedNoteInfo.textContent = '点击音符查看详情';
                    selectedNoteDetail.textContent = '';
                }
                renderNotes();
                showToast('🗑️ 音符已删除');
            }

            // ============ 画布点击放置音符 ============
            rollCanvasWrapper.addEventListener('mousedown', (e) => {
                if (e.target === rollCanvasInner || e.target === rollGrid || e.target ===
                    rollCanvasWrapper) {
                    if (currentTool === 'pencil') {
                        const rect = rollCanvasInner.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const row = Math.floor(y / ROW_HEIGHT);
                        const clampedRow = Math.max(0, Math.min(TOTAL_SEMITONES - 1, row));
                        const snappedX = snapToGrid(x);
                        const noteWidth = PIXELS_PER_BEAT / 2; // 默认八分音符长度

                        const newNote = {
                            id: ++noteIdCounter,
                            x: snappedX,
                            row: clampedRow,
                            width: noteWidth,
                            lyric: '♪',
                            color: noteColors[clampedRow % noteColors.length],
                        };
                        notes.push(newNote);
                        selectNote(newNote.id);
                        renderNotes();
                        showToast('🎵 音符已放置 · 行' + clampedRow);
                    } else if (currentTool === 'select') {
                        selectedNoteId = null;
                        selectedNoteInfo.textContent = '点击音符查看详情';
                        selectedNoteDetail.textContent = '';
                        renderNotes();
                    }
                }
            });

            // ============ 全局鼠标移动和释放 ============
            document.addEventListener('mousemove', (e) => {
                if (isDragging && dragNoteId !== null) {
                    const note = notes.find(n => n.id === dragNoteId);
                    if (!note) return;
                    const dx = e.clientX - dragStartX;
                    const dy = e.clientY - dragStartY;
                    const newX = Math.max(0, dragNoteOrigX + dx);
                    const newRow = Math.max(0, Math.min(TOTAL_SEMITONES - 1, dragNoteOrigRow + Math.round(dy /
                        ROW_HEIGHT)));
                    note.x = snapToGrid(newX);
                    note.row = newRow;
                    note.color = noteColors[newRow % noteColors.length];
                    renderNotes();
                }
            });

            document.addEventListener('mouseup', () => {
                if (isDragging && dragNoteId !== null) {
                    const note = notes.find(n => n.id === dragNoteId);
                    if (note) {
                        note.x = snapToGrid(note.x);
                        renderNotes();
                    }
                }
                isDragging = false;
                dragNoteId = null;
            });

            // ============ 量化 ============
            function snapToGrid(x) {
                const quantizeVal = parseInt(quantizeSelect.value);
                const gridSize = PIXELS_PER_BEAT / (quantizeVal / 4);
                return Math.round(x / gridSize) * gridSize;
            }

            quantizeBtn.addEventListener('click', () => {
                notes.forEach(note => {
                    note.x = snapToGrid(note.x);
                });
                renderNotes();
                showToast('🎯 音符已量化 (' + quantizeSelect.value + '分音符网格)');
            });

            // ============ 清除音符 ============
            clearNotesBtn.addEventListener('click', () => {
                if (notes.length === 0) {
                    showToast('📋 没有音符可清除');
                    return;
                }
                if (confirm('确定要清除所有 ' + notes.length + ' 个音符吗？')) {
                    notes = [];
                    selectedNoteId = null;
                    selectedNoteInfo.textContent = '点击音符查看详情';
                    selectedNoteDetail.textContent = '';
                    renderNotes();
                    showToast('🗑️ 所有音符已清除');
                }
            });

            // ============ 工具切换 ============
            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b
                        .classList.remove('active-tool'));
                    btn.classList.add('active-tool');
                    currentTool = btn.dataset.tool;
                    showToast('🔧 切换到: ' + (currentTool === 'pencil' ? '铅笔工具' :
                        currentTool === 'select' ? '选择工具' : '橡皮擦'));
                });
            });

            // ============ 播放控制 ============
            function updatePlayhead() {
                playhead.style.left = playheadPosition + 'px';
                // 更新时间显示
                const totalBeats = playheadPosition / PIXELS_PER_BEAT;
                const minutes = Math.floor(totalBeats / bpm);
                const seconds = Math.floor((totalBeats / bpm * 60) % 60);
                const centiseconds = Math.floor((totalBeats / bpm * 6000) % 100);
                timeDisplay.textContent =
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0') + '.' +
                    String(centiseconds).padStart(2, '0');
            }

            function animatePlayhead(timestamp) {
                if (!isPlaying) return;
                if (!lastFrameTime) lastFrameTime = timestamp;
                const dt = (timestamp - lastFrameTime) / 1000; // 秒
                lastFrameTime = timestamp;

                const pixelsPerSecond = (bpm / 60) * PIXELS_PER_BEAT;
                playheadPosition += pixelsPerSecond * dt;

                if (playheadPosition > CANVAS_WIDTH + 120) {
                    playheadPosition = 80;
                }

                updatePlayhead();
                // 滚动跟随
                const wrapperWidth = rollCanvasWrapper.clientWidth;
                const scrollLeft = playheadPosition - wrapperWidth / 3;
                if (scrollLeft > 0) {
                    rollCanvasWrapper.scrollLeft = scrollLeft;
                }

                animationId = requestAnimationFrame(animatePlayhead);
            }

            playBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if (isPlaying) {
                    playBtn.classList.add('playing');
                    playBtn.textContent = '⏸️';
                    lastFrameTime = null;
                    animationId = requestAnimationFrame(animatePlayhead);
                    showToast('▶️ 播放中... BPM: ' + bpm);
                } else {
                    playBtn.classList.remove('playing');
                    playBtn.textContent = '▶️';
                    if (animationId) cancelAnimationFrame(animationId);
                    animationId = null;
                    lastFrameTime = null;
                    updatePlayhead();
                    showToast('⏸️ 已暂停');
                }
            });

            bpmInput.addEventListener('change', () => {
                bpm = Math.max(40, Math.min(300, parseInt(bpmInput.value) || 140));
                bpmInput.value = bpm;
                showToast('🎵 BPM 设置为: ' + bpm);
            });

            // ============ 歌词填入 ============
            insertLyricBtn.addEventListener('click', () => {
                const lyric = lyricInput.value.trim();
                if (!lyric) {
                    showToast('📝 请先输入歌词');
                    return;
                }
                if (selectedNoteId === null) {
                    showToast('📝 请先选中一个音符');
                    return;
                }
                const note = notes.find(n => n.id === selectedNoteId);
                if (note) {
                    note.lyric = lyric;
                    renderNotes();
                    selectNote(selectedNoteId);
                    showToast('📝 歌词已填入: ' + lyric);
                    lyricInput.value = '';
                }
            });

            lyricInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    insertLyricBtn.click();
                }
            });

            // ============ 参数滑块 ============
            function bindSlider(slider, displayId) {
                const display = document.getElementById(displayId);
                slider.addEventListener('input', () => {
                    display.textContent = slider.value;
                });
            }
            bindSlider(breathSlider, 'breathVal');
            bindSlider(velocitySlider, 'velocityVal');
            bindSlider(vibratoSlider, 'vibratoVal');
            bindSlider(claritySlider, 'clarityVal');
            bindSlider(tensionSlider, 'tensionVal');

            // ============ 预设按钮 ============
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove(
                        'active-preset'));
                    btn.classList.add('active-preset');
                    const preset = btn.dataset.preset;
                    const presets = {
                        normal: { breath: 45, velocity: 72, vibrato: 38, clarity: 85,
                            tension: 55 },
                        soft: { breath: 70, velocity: 40, vibrato: 55, clarity: 75, tension: 25 },
                        power: { breath: 20, velocity: 110, vibrato: 25, clarity: 90, tension: 85 },
                        cute: { breath: 55, velocity: 65, vibrato: 60, clarity: 88, tension: 35 },
                        dark: { breath: 35, velocity: 55, vibrato: 20, clarity: 60, tension: 70 },
                    };
                    const vals = presets[preset] || presets.normal;
                    breathSlider.value = vals.breath;
                    document.getElementById('breathVal').textContent = vals.breath;
                    velocitySlider.value = vals.velocity;
                    document.getElementById('velocityVal').textContent = vals.velocity;
                    vibratoSlider.value = vals.vibrato;
                    document.getElementById('vibratoVal').textContent = vals.vibrato;
                    claritySlider.value = vals.clarity;
                    document.getElementById('clarityVal').textContent = vals.clarity;
                    tensionSlider.value = vals.tension;
                    document.getElementById('tensionVal').textContent = vals.tension;
                    showToast('🎭 预设已应用: ' + btn.textContent.trim());
                });
            });

            // ============ 音轨交互 ============
            document.querySelectorAll('.track-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('track-mute') || e.target.classList.contains(
                            'track-solo')) return;
                    document.querySelectorAll('.track-item').forEach(i => i.classList.remove(
                        'active'));
                    item.classList.add('active');
                });
                const muteBtn = item.querySelector('.track-mute');
                const soloBtn = item.querySelector('.track-solo');
                muteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    muteBtn.classList.toggle('muted');
                });
                soloBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    soloBtn.classList.toggle('soloed');
                });
            });

            // ============ Toast ============
            let toastTimeout;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ============ 粒子背景 ============
            function createParticles() {
                particlesBg.innerHTML = '';
                const colors = ['#f08cb4', '#b38cd9', '#7eb8e0', '#c9a8e8', '#f4c8d8', '#d0c8f0'];
                for (let i = 0; i < 28; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = (60 + Math.random() * 40) + '%';
                    particle.style.width = (2 + Math.random() * 5) + 'px';
                    particle.style.height = particle.style.width;
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.animationDuration = (8 + Math.random() * 18) + 's';
                    particle.style.animationDelay = Math.random() * 15 + 's';
                    particle.style.opacity = 0.15 + Math.random() * 0.35;
                    particlesBg.appendChild(particle);
                }
            }

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                switch (e.key.toLowerCase()) {
                    case ' ':
                        e.preventDefault();
                        playBtn.click();
                        break;
                    case 'p':
                        currentTool = 'pencil';
                        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove(
                            'active-tool'));
                        document.querySelector('.tool-btn[data-tool="pencil"]')?.classList.add('active-tool');
                        showToast('✏️ 铅笔工具');
                        break;
                    case 's':
                        currentTool = 'select';
                        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove(
                            'active-tool'));
                        document.querySelector('.tool-btn[data-tool="select"]')?.classList.add('active-tool');
                        showToast('🖱️ 选择工具');
                        break;
                    case 'e':
                        currentTool = 'eraser';
                        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove(
                            'active-tool'));
                        document.querySelector('.tool-btn[data-tool="eraser"]')?.classList.add('active-tool');
                        showToast('🧹 橡皮擦');
                        break;
                    case 'delete':
                    case 'backspace':
                        if (selectedNoteId !== null) {
                            deleteNote(selectedNoteId);
                            e.preventDefault();
                        }
                        break;
                    case 'q':
                        quantizeBtn.click();
                        break;
                }
            });

            // ============ 初始化示例音符 ============
            function createDemoNotes() {
                const demoMelody = [
                    { row: 24, lyric: 'さ', width: 40 },
                    { row: 26, lyric: 'く', width: 40 },
                    { row: 28, lyric: 'ら', width: 40 },
                    { row: 29, lyric: '✨', width: 60 },
                    { row: 28, lyric: 'ふ', width: 40 },
                    { row: 26, lyric: 'わ', width: 40 },
                    { row: 24, lyric: 'り', width: 60 },
                    { row: 22, lyric: '💫', width: 40 },
                    { row: 24, lyric: 'ゆ', width: 40 },
                    { row: 26, lyric: 'め', width: 40 },
                    { row: 28, lyric: 'み', width: 40 },
                    { row: 31, lyric: 'る', width: 80 },
                ];
                let xPos = 80;
                demoMelody.forEach((m, i) => {
                    notes.push({
                        id: ++noteIdCounter,
                        x: xPos,
                        row: m.row,
                        width: m.width,
                        lyric: m.lyric,
                        color: noteColors[m.row % noteColors.length],
                    });
                    xPos += m.width + 16;
                });
            }

            // ============ 初始化 ============
            function init() {
                rollCanvasInner.style.width = CANVAS_WIDTH + 'px';
                rollCanvasInner.style.height = CANVAS_HEIGHT + 'px';
                initPianoKeys();
                initTimeRuler();
                initGrid();
                createParticles();
                createDemoNotes();
                renderNotes();
                updatePlayhead();
                rollCanvasWrapper.scrollLeft = 0;
                rollCanvasWrapper.scrollTop = ROW_HEIGHT * 10;
                showToast('🌸 欢迎使用星咏歌姬 · 点击钢琴卷帘放置音符 | 空格键播放');
            }

            init();
        })();
    </script>
</body>
</html>
