<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SXSEditor</title>
    <script src="./themes/themeBootstrap.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="toolbar-group transport-group">
          <!-- 传输控件只保留图标（省出的宽度给右侧的进度/ETA 用）。
               文字标签退到 title（悬停提示）与 aria-label（无障碍）——
               注意这里不能再用 data-i18n：applyLocale 会往 textContent 里填文本，
               图标会被文字挤开。用 data-i18n-title / data-i18n-aria-label 即可。 -->
          <button id="btn-play" class="transport-btn" data-icon="play"
                  data-i18n-title="main.play" data-i18n-aria-label="main.play"
                  aria-label="播放" disabled></button>
          <button id="btn-pause" class="transport-btn" data-icon="pause"
                  data-i18n-title="main.pause" data-i18n-aria-label="main.pause"
                  aria-label="暂停" disabled></button>
          <button id="btn-stop" class="transport-btn" data-icon="stop"
                  data-i18n-title="main.stop" data-i18n-aria-label="main.stop"
                  aria-label="停止" disabled></button>
          <!-- 重新合成（AI Retake）：丢弃当前渲染结果，用同一份输入重跑一遍。
               与 Stop 的区别是 Stop 只停播放、保留结果；本按钮是主动重来。
               放在 Stop 右侧，语义上属于"对当前结果再操作一次"。 -->
          <button id="btn-retake" class="transport-btn" data-icon="refresh"
                  data-i18n-title="main.retakeHint" data-i18n-aria-label="main.retake"
                  aria-label="重新合成" disabled></button>
          <!-- 播放时间码：audioPlayback / eventHandlers / 插件阻滞浮层都往这个
               节点写文本（playhead rAF、拖拽 playhead、插件 progress）。工具栏
               改版时它被误删过一次，结果每帧抛 TypeError 打断播放头动画
               —— 删除前先看 src/renderer/state.js 里的 dom.timeDisplay。 -->
          <span id="time-display">00:00:000</span>
          <!-- 推理 / 模型加载进度：DAW 风格的常驻状态条（宽度固定、始终占位，
               避免文本出现/消失时两侧控件左右跳动）。等待推理（百分比未知）时
               轨道仍在、填充停在原处；进度条本身不做 display:none。 -->
          <div id="transport-status" class="transport-status" role="status" aria-live="polite">
            <span id="transport-status-text" class="transport-status-text"></span>
            <div id="transport-progress" class="transport-progress">
              <div id="transport-progress-fill" class="transport-progress-fill"></div>
            </div>
          </div>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group tempo-group">
          <label class="toolbar-field">BPM <input id="bpm-input" type="number" value="120" min="1" max="999" /></label>
          <!-- 拍号：两个输入框收进一个 4/4 控件。原先 "Time Sig [4] / [4]" 占四个
               元素宽度，且和 BPM 并排时看不出是一组；现在外显一个 "4/4" 徽标，
               点开才编辑分子/分母（id 不变，原有 change 监听不受影响）。 -->
          <div class="toolbar-popover-anchor">
            <button id="btn-timesig" type="button" class="toolbar-timesig"
                    aria-haspopup="dialog" aria-expanded="false"
                    data-i18n-aria-label="main.timeSignature" data-i18n-title="main.timeSignature"
                    aria-label="Time Sig" title="Time Sig">
              <span id="timesig-display">4/4</span>
              <span class="icon icon--sm" data-icon="chevron-down" aria-hidden="true"></span>
            </button>
            <div class="toolbar-popover" id="timesig-popover" hidden role="dialog"
                 data-i18n-aria-label="main.timeSignature" aria-label="Time Sig">
              <label class="toolbar-popover-row" for="time-sig-num">
                <span data-i18n="main.timeSignature">Time Sig</span>
                <span class="toolbar-popover-fields">
                  <input id="time-sig-num" type="number" value="4" min="1" max="32"
                         aria-label="Time signature numerator" />
                  <span aria-hidden="true">/</span>
                  <input id="time-sig-den" type="number" value="4" min="1" max="32"
                         aria-label="Time signature denominator" />
                </span>
              </label>
            </div>
          </div>
          <!-- Auto Shift：名字本身不自解释。加长文案放 title，标签用 i18n（此前硬编码英文）。 -->
          <label class="toolbar-field toolbar-toggle"
                 data-i18n-title="main.autoShiftHint" title="Automatically adjust pitch shift based on reference audio">
            <input type="checkbox" id="auto-shift-check" />
            <span data-i18n="main.autoShift">Auto Shift</span>
          </label>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group project-group">
          <button id="btn-load" data-i18n="main.load" data-i18n-title="main.load" data-icon="folder-open">加载</button>
          <button id="btn-export" data-i18n="main.export" data-i18n-title="main.export" data-icon="upload">导出</button>
          <button id="btn-export-lrc" data-i18n="main.exportLrc" data-i18n-title="main.exportLrc" data-icon="file-text">导出LRC</button>
        </div>
        <div class="toolbar-divider" id="plugin-toolbar-divider" hidden></div>
        <!-- 插件工具栏：位置固定在内置组之后、弹性空隙之前。
             有插件按钮时才显示（同时显示左侧分隔线），没装插件时整块 hidden，
             不占宽度也不改变现有按钮的位置。 -->
        <div class="toolbar-group plugin-toolbar-slot" id="plugin-toolbar-slot" hidden></div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-group market-group">
          <button id="btn-open-singer-market" data-i18n="main.openSingerMarket" data-i18n-title="main.openSingerMarket" data-icon="market">歌手市场</button>
        </div>
        <!-- 低频动作收进 ⋯：音频转 MIDI / 导入 MIDI 平时用不到，却一直占着
             顶栏最宝贵的位置。按钮仍在 DOM 里（id 不变），只是搬进了弹出层。 -->
        <div class="toolbar-group more-group">
          <div class="toolbar-popover-anchor">
            <button id="btn-toolbar-more" type="button" class="toolbar-more"
                    aria-haspopup="menu" aria-expanded="false"
                    data-i18n-title="main.moreActions" data-i18n-aria-label="main.moreActions"
                    data-icon="more-horizontal" title="More actions" aria-label="More actions"></button>
            <div class="toolbar-popover toolbar-popover--menu" id="toolbar-more-panel" hidden role="menu">
              <button id="btn-audio-to-midi" role="menuitem"
                      data-i18n="main.audioToMidi" data-i18n-title="main.audioToMidi" data-icon="music">音频转MIDI</button>
              <button id="btn-import-midi" role="menuitem"
                      data-i18n="main.importMidi" data-i18n-title="main.importMidi" data-icon="file-music">导入MIDI</button>
            </div>
          </div>
        </div>
        <div class="toolbar-group version-group">
          <span id="version-display" class="version-badge">v-</span>
        </div>
      </div>
      <div id="main-content">
        <div id="singer-panel">
          <div id="singer-panel-header">
            <span data-i18n="main.tracks">轨道</span>
            <div class="singer-panel-actions">
              <button id="btn-add-singer" aria-label="添加歌手" data-i18n-title="main.addSinger">+</button>
              <button id="btn-import-accompaniment" class="btn-import-accompaniment" aria-label="导入伴奏" data-i18n-title="main.importAccompaniment">
                <span data-icon="music" data-icon-class="icon--sm"></span>
              </button>
            </div>
          </div>
          <div id="singer-list" role="list"></div>
        </div>
        <div id="fragment-timeline">
          <div id="fragment-header">
            <span data-i18n="main.fragmentTimeline">分片时间轴</span>
            <span id="bpm-display-badge"><span data-icon="music-note" data-icon-class="icon--md"></span><span id="bpm-display-text">120 BPM</span></span>
          </div>
          <div id="fragment-canvas-container">
            <!-- a11y(U3)：分片时间轴是**可交互控件**而不是一张图片。role="img" 会让
                 读屏软件把它当静态图念一句 label 就结束，键盘也无法聚焦。改为
                 role="application" + tabindex，并挂一个 aria-live 容器播报状态。 -->
            <canvas id="fragment-canvas" role="application" tabindex="0"
                    aria-label="分片时间轴：方向键移动选择，Delete 删除，Enter 打开分片编辑器"></canvas>
            <canvas id="fragment-playhead-canvas" role="presentation" aria-hidden="true" aria-label="播放指针"></canvas>
            <!-- 插件浮层：位于画布之上、播放指针之下。默认不接收指针事件，
                 否则插件一装，时间轴就点不动了（原因还很难看出来）。 -->
            <div id="plugin-overlay-layer" class="plugin-overlay-layer" hidden aria-live="off"></div>
            <p id="fragment-canvas-a11y-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </div>
      <!-- 状态栏：只在有插件条目时出现（24px）。左侧放"当前在做什么"，
           右侧放"插件自己的状态"。没有插件时整条 hidden，主窗口布局与以前一致。 -->
      <div id="status-bar" class="status-bar" hidden>
        <div id="status-bar-left" class="status-bar-slot status-bar-slot--left"></div>
        <div id="status-bar-right" class="status-bar-slot status-bar-slot--right"></div>
      </div>
    </div>
    <!-- ort.all.min.js (onnxruntime-web UMD bundle, ~5-10MB) was previously
         loaded synchronously here, blocking did-finish-load. It is now
         loaded dynamically on first use via src/inference/webnn/ortSetup.js
         loadOrtScript(). The .wasm files are still copied alongside by
         webpack CopyPlugin (webpack.renderer.config.js). -->
  </body>
</html>
