<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SXSEditor</title>
    <script src="./themes/themeBootstrap.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="toolbar-group transport-group">
          <!-- 传输控件只保留图标（省出的宽度给右侧的进度/ETA 用）。
               文字标签退到 title（悬停提示）与 aria-label（无障碍）——
               注意这里不能再用 data-i18n：applyLocale 会往 textContent 里填文本，
               图标会被文字挤开。用 data-i18n-title / data-i18n-aria-label 即可。 -->
          <button id="btn-play" class="transport-btn" data-icon="play"
                  data-i18n-title="main.play" data-i18n-aria-label="main.play"
                  aria-label="播放" disabled></button>
          <button id="btn-pause" class="transport-btn" data-icon="pause"
                  data-i18n-title="main.pause" data-i18n-aria-label="main.pause"
                  aria-label="暂停" disabled></button>
          <button id="btn-stop" class="transport-btn" data-icon="stop"
                  data-i18n-title="main.stop" data-i18n-aria-label="main.stop"
                  aria-label="停止" disabled></button>
          <!-- 推理 / 模型加载进度：空闲时 display:none（完全不占位），
               有进度时展开，文本右对齐，进度条在最右 -->
          <div id="transport-status" class="transport-status" role="status" aria-live="polite">
            <span id="transport-status-text" class="transport-status-text"></span>
            <div id="transport-progress" class="transport-progress" hidden>
              <div id="transport-progress-fill" class="transport-progress-fill"></div>
            </div>
          </div>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span id="time-display">00:00:000</span>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <label>BPM <input id="bpm-input" type="number" value="120" min="1" max="999" /></label>
          <label data-i18n="main.timeSignature">拍号 <input id="time-sig-num" type="number" value="4" min="1" max="32" /> / <input id="time-sig-den" type="number" value="4" min="1" max="32" /></label>
          <label><input type="checkbox" id="auto-shift-check" />Auto Shift</label>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-load" data-i18n="main.load" data-i18n-title="main.load" data-icon="folder-open">加载</button>
          <button id="btn-export" data-i18n="main.export" data-i18n-title="main.export" data-icon="upload">导出</button>
          <button id="btn-export-lrc" data-i18n="main.exportLrc" data-i18n-title="main.exportLrc" data-icon="file-text">导出LRC</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-audio-to-midi" data-i18n="main.audioToMidi" data-i18n-title="main.audioToMidi" data-icon="music">音频转MIDI</button>
          <button id="btn-import-midi" data-i18n="main.importMidi" data-i18n-title="main.importMidi" data-icon="file-music">导入MIDI</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button id="btn-open-singer-market" data-i18n="main.openSingerMarket" data-i18n-title="main.openSingerMarket" data-icon="market">歌手市场</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span id="version-display" class="version-badge">v-</span>
        </div>
      </div>
      <div id="main-content">
        <div id="singer-panel">
          <div id="singer-panel-header">
            <span data-i18n="main.tracks">轨道</span>
            <div class="singer-panel-actions">
              <button id="btn-add-singer" aria-label="添加歌手" data-i18n-title="main.addSinger">+</button>
              <button id="btn-import-accompaniment" class="btn-import-accompaniment" aria-label="导入伴奏" data-i18n-title="main.importAccompaniment">
                <span data-icon="music" data-icon-class="icon--sm"></span>
              </button>
            </div>
          </div>
          <div id="singer-list" role="list"></div>
        </div>
        <div id="fragment-timeline">
          <div id="fragment-header">
            <span data-i18n="main.fragmentTimeline">分片时间轴</span>
            <span id="bpm-display-badge"><span data-icon="music-note" data-icon-class="icon--md"></span><span id="bpm-display-text">120 BPM</span></span>
          </div>
          <div id="fragment-canvas-container">
            <!-- a11y(U3)：分片时间轴是**可交互控件**而不是一张图片。role="img" 会让
                 读屏软件把它当静态图念一句 label 就结束，键盘也无法聚焦。改为
                 role="application" + tabindex，并挂一个 aria-live 容器播报状态。 -->
            <canvas id="fragment-canvas" role="application" tabindex="0"
                    aria-label="分片时间轴：方向键移动选择，Delete 删除，Enter 打开分片编辑器"></canvas>
            <canvas id="fragment-playhead-canvas" role="presentation" aria-hidden="true" aria-label="播放指针"></canvas>
            <p id="fragment-canvas-a11y-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
          </div>
        </div>
      </div>
    </div>
    <!-- ort.all.min.js (onnxruntime-web UMD bundle, ~5-10MB) was previously
         loaded synchronously here, blocking did-finish-load. It is now
         loaded dynamically on first use via src/inference/webnn/ortSetup.js
         loadOrtScript(). The .wasm files are still copied alongside by
         webpack CopyPlugin (webpack.renderer.config.js). -->
  </body>
</html>
