<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="preprocess.audioPreprocess">音频预处理</title>
    <script src="./themes/themeBootstrap.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <div class="toolbar-group">
          <button id="btn-play-pause" class="btn-toolbar" data-i18n="preprocess.play" data-icon="play">播放</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <!-- 主操作实心、次操作描边：这两个按钮原本都是实心（蓝 + 绿），
               并列时没有主次，"下一步点哪个"要靠读完整标签才知道。 -->
          <button id="btn-extract-f0" class="btn-toolbar btn-primary" data-i18n="preprocess.rmvpeExtractF0" data-icon="sliders">RMVPE提取F0</button>
          <button id="btn-extract-f0-basic-pitch" class="btn-toolbar" data-i18n="preprocess.basicPitchExtractMidi" data-icon="music">提取MIDI</button>
          <button id="btn-import-midi" class="btn-toolbar" data-i18n="preprocess.importMidi" data-icon="file-music">导入MIDI</button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <span id="page-title" data-i18n="preprocess.audioPreprocess">音频预处理</span>
        </div>
        <div style="flex:1"></div>
        <div class="toolbar-group">
          <button id="btn-save" class="btn-toolbar btn-success" data-i18n="preprocess.save" data-icon="save">保存</button>
          <button id="btn-back" class="btn-toolbar" data-i18n="preprocess.back" data-icon="close">返回</button>
        </div>
      </div>
      <div id="main-content">
        <div id="extract-panel">
          <div id="extract-panel-header">
            <span class="section-title" data-i18n="preprocess.extractPanel">提取参数</span>
            <span id="extract-status" class="extract-status"></span>
            <div class="extract-panel-actions">
              <button id="btn-audition" class="btn-toolbar" data-i18n="preprocess.auditionSynth" data-icon="music">播放合成音</button>
              <button id="btn-toggle-panel" class="btn-toolbar btn-small" data-i18n="preprocess.collapsePanel" data-icon="chevron-up">收起</button>
            </div>
          </div>
          <div id="extract-panel-body">
            <div id="fcpe-params-notice" class="extract-notice" style="display:none;"></div>

            <!-- 三个分组：预设与算法 / F0 范围 / 节拍与响度。
                 原先 11 个字段平铺成两行 flex，宽度由内容决定（106/193/112 各不相同），
                 标签彼此贴在一起；分组 + 等宽网格后可以按语义扫读。 -->
            <div class="extract-subgroup">
              <span class="extract-subgroup-title" data-i18n="preprocess.groupPreset">预设与算法</span>
              <div class="extract-row">
                <div class="extract-field">
                  <label for="preset-select" data-i18n="preprocess.presetLabel" data-i18n-title="preprocess.tip.preset">预设方案</label>
                  <select id="preset-select">
                    <option value="popMale" data-i18n="preprocess.preset.popMale">流行男声</option>
                    <option value="folkFemale" data-i18n="preprocess.preset.folkFemale">民族女声</option>
                    <option value="traditional" data-i18n="preprocess.preset.traditional">戏曲/滑音多</option>
                    <option value="childHigh" data-i18n="preprocess.preset.childHigh">儿童/高音域</option>
                    <option value="custom" data-i18n="preprocess.preset.custom">自定义</option>
                  </select>
                </div>
                <div class="extract-field">
                  <label for="threshold-select" data-i18n="preprocess.thresholdLabel" data-i18n-title="preprocess.tip.threshold">静音阈值 (FCPE)</label>
                  <select id="threshold-select">
                    <option value="low" data-i18n="preprocess.thresholdLow">低 (0.003)</option>
                    <option value="mid" data-i18n="preprocess.thresholdMid">中 (0.006)</option>
                    <option value="high" data-i18n="preprocess.thresholdHigh">高 (0.01)</option>
                  </select>
                </div>
                <div class="extract-field">
                  <label for="smoothing-select" data-i18n="preprocess.smoothingLabel" data-i18n-title="preprocess.tip.smoothing">平滑度 (FCPE)</label>
                  <select id="smoothing-select">
                    <option value="low" data-i18n="preprocess.smoothingLow">低</option>
                    <option value="medium" data-i18n="preprocess.smoothingMedium">中</option>
                    <option value="high" data-i18n="preprocess.smoothingHigh">高</option>
                  </select>
                </div>
                <div class="extract-field">
                  <label for="quantization-select" data-i18n="preprocess.quantizationLabel" data-i18n-title="preprocess.tip.quantization">音高量化 (FCPE)</label>
                  <select id="quantization-select">
                    <option value="strict" data-i18n="preprocess.quantizationStrict">严格量化</option>
                    <option value="pitchbend" data-i18n="preprocess.quantizationPitchbend">保留滑音 (Pitch Bend)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="extract-subgroup">
              <span class="extract-subgroup-title" data-i18n="preprocess.groupF0Range">F0 范围</span>
              <div class="extract-row">
                <div class="extract-field">
                  <label for="range-auto" class="inline-label" data-i18n-title="preprocess.tip.autoRange">
                    <input type="checkbox" id="range-auto" />
                    <span data-i18n="preprocess.autoRange">自动适配音域 (FCPE)</span>
                  </label>
                </div>
                <div class="extract-field">
                  <label for="f0-min" data-i18n="preprocess.f0MinLabel" data-i18n-title="preprocess.tip.f0Min">F0 下限 (Hz) (FCPE)</label>
                  <input type="number" id="f0-min" min="20" max="2000" step="1" />
                </div>
                <div class="extract-field">
                  <label for="f0-max" data-i18n="preprocess.f0MaxLabel" data-i18n-title="preprocess.tip.f0Max">F0 上限 (Hz) (FCPE)</label>
                  <input type="number" id="f0-max" min="20" max="2000" step="1" />
                </div>
                <div class="extract-field">
                  <label for="min-note" data-i18n="preprocess.minNoteLabel" data-i18n-title="preprocess.tip.minNote">最短音符 (秒) (FCPE)</label>
                  <input type="number" id="min-note" min="0.01" max="1" step="0.01" />
                </div>
              </div>
            </div>

            <div class="extract-subgroup">
              <span class="extract-subgroup-title" data-i18n="preprocess.groupTempoLoudness">节拍与响度</span>
              <div class="extract-row">
                <div class="extract-field">
                  <label for="bpm-auto" class="inline-label" data-i18n-title="preprocess.tip.autoBpm">
                    <input type="checkbox" id="bpm-auto" />
                    <span data-i18n="preprocess.autoBpm">自动检测 BPM (FCPE)</span>
                  </label>
                </div>
                <div class="extract-field">
                  <label for="bpm-input" data-i18n="preprocess.bpmLabel" data-i18n-title="preprocess.tip.bpm">BPM (FCPE)</label>
                  <input type="number" id="bpm-input" min="40" max="240" step="1" />
                </div>
                <div class="extract-field">
                  <label for="normalize-check" class="inline-label" data-i18n-title="preprocess.tip.normalize">
                    <input type="checkbox" id="normalize-check" />
                    <span data-i18n="preprocess.normalizeLabel">响度归一化 (FCPE)</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="waveform-section">
          <div id="waveform-header">
            <span class="section-title" data-i18n="preprocess.wavWaveform">WAV 波形</span>
            <span id="wav-file-name" class="file-info">-</span>
          </div>
          <div id="waveform-container">
            <canvas id="waveform-canvas" role="img" aria-label="WAV波形"></canvas>
            <!-- 空态：没有音频时不再是一块空白画布。载入音频后由
                 audioPreprocess/ipcHandlers.js 隐藏。 -->
            <div id="waveform-empty" class="panel-empty">
              <span class="icon icon--md" data-icon="music" aria-hidden="true"></span>
              <span data-i18n="preprocess.waveformEmptyHint">载入音频后在这里显示波形</span>
            </div>
          </div>
        </div>
        <div id="resize-handle"></div>
        <div id="midi-section">
          <div id="midi-header">
            <span class="section-title" data-i18n="preprocess.midiEditor">MIDI 编辑器</span>
            <div class="midi-header-right">
              <span id="midi-info" class="file-info" data-i18n="preprocess.waitingForExtraction">-</span>
              <button id="btn-toggle-f0" class="f0-toggle" type="button" aria-pressed="true"
                      data-i18n-title="preprocess.toggleF0">
                <span class="f0-toggle-dot" aria-hidden="true"></span>F0
              </button>
            </div>
          </div>
          <div id="midi-body">
            <div id="midi-container">
              <canvas id="midi-canvas" role="img" aria-label="MIDI编辑器：在空白处按下左键并拖动可新建音符，双击音符编辑歌词，Delete 删除选中音符" data-i18n-aria-label="preprocess.midiCanvasAriaLabel"></canvas>
              <!-- 空态：提取到音符前显示提示，updateMidiInfo() 在有音符时隐藏。 -->
              <div id="midi-empty" class="panel-empty">
                <span class="icon icon--md" data-icon="pencil" aria-hidden="true"></span>
                <span data-i18n="preprocess.midiEmptyHint">点「RMVPE提取F0」或「提取MIDI」开始，也可以直接在空白处画音符</span>
              </div>
            </div>
            <div id="midi-vscroll" class="scrollbar scrollbar-vertical" role="scrollbar" aria-orientation="vertical" tabindex="-1">
              <div id="midi-vscroll-thumb" class="scrollbar-thumb"></div>
            </div>
          </div>
          <div id="midi-hscroll" class="scrollbar scrollbar-horizontal" role="scrollbar" aria-orientation="horizontal" tabindex="-1">
            <div id="midi-hscroll-thumb" class="scrollbar-thumb"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
