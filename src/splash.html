<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SXSEditor</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Matches BrowserWindow backgroundColor and SVG solid fill
           (THEME.bgApp = #14141f = --bg-app in dark-aurora.theme.json),
           so the empty window → painted-SVG transition is invisible. */
        background: #14141f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        color: #f4f4f8;
      }
      #splash-root {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="splash-root"></div>
  </body>
</html>
