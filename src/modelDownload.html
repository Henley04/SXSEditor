<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="modelDownload.title">模型文件下载</title>
  <script src="./themes/themeBootstrap.js"></script>
</head>
<body>
  <div class="header">
    <h1 data-i18n="modelDownload.title">SXSEditor 模型文件下载</h1>
    <p id="statusText" data-i18n="modelDownload.detecting">正在检测模型文件...</p>
  </div>

  <div class="precision-section" id="precisionSection" style="display:none;">
    <label class="precision-label" data-i18n="modelDownload.precisionLabel">模型精度</label>
    <div class="precision-options">
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="fp32" checked>
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionFp32">FP32 (全精度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionFp32Desc">最高精度，音质最好，显存占用最大，推荐高性能独显用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="fp16">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionFp16">FP16 (半精度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionFp16Desc">音质接近全精度，显存占用适中，推荐独显用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="int8">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionInt8">INT8 (量化)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionInt8Desc">音质略有损失，显存占用更小，推荐核显或低显存用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="int8-npu">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionInt8Npu">INT8-NPU (NPU 优化固定维度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionInt8NpuDesc">固定维度模型，替换 NPU 不支持的算子并固化静态 shape，支持自定义 batch size，推荐 NPU 用户使用</span>
        </span>
      </label>
    </div>
  </div>

  <div class="version-info-section" id="versionInfoSection" style="display:none;">
    <div class="version-info-row">
      <span class="version-label" data-i18n="modelDownload.currentVersion">当前版本</span>
      <span class="version-value" id="localVersionValue">-</span>
    </div>
    <div class="version-info-row">
      <span class="version-label" data-i18n="modelDownload.latestVersion">最新版本</span>
      <span class="version-value" id="latestVersionValue">-</span>
    </div>
    <div class="version-select-row">
      <span class="version-label" data-i18n="modelDownload.selectVersion">选择版本</span>
      <select id="versionSelect" class="version-select" disabled>
        <option value="latest" data-i18n="modelDownload.latestVersionLabel">最新版本 (Latest)</option>
      </select>
    </div>
    <div class="version-update-banner" id="versionUpdateBanner" style="display:none;">
      <span class="update-icon" aria-hidden="true">&#9888;</span>
      <span class="update-text" id="versionUpdateText"></span>
      <button class="btn btn-update" id="updateModelBtn" data-i18n="modelDownload.update">更新</button>
    </div>
    <a href="#" id="modelUpdatesLink" class="model-updates-link" data-i18n="modelDownload.viewVersionDetails">查看模型版本详情</a>
  </div>

  <div class="overall-progress" id="progressSection" style="display:none;">
    <div class="label">
      <span id="overallLabel" data-i18n="modelDownload.overallProgress">总进度</span>
      <span id="overallPercent">0%</span>
    </div>
    <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar-fill" id="overallBar"></div>
    </div>
  </div>

  <div class="dir-info" id="dirInfo" style="display:none;">
    <span class="dir-label" data-i18n="modelDownload.downloadLocation">下载位置:</span>
    <span class="dir-path" id="dirPath"></span>
    <button class="btn-change-dir" id="changeDirBtn" data-i18n="modelDownload.change">更换</button>
  </div>

  <div class="speed-info" id="speedInfo"></div>

  <div class="file-list" id="fileList"></div>

  <div class="error-message" id="errorMessage"></div>

  <div class="optional-models-section" id="optionalModelsSection">
    <details class="optional-models-details" id="optionalModelsDetails">
      <summary class="optional-models-summary">
        <span class="summary-text" data-i18n="modelDownload.optionalModels">可选模型</span>
        <span class="summary-badge" id="optionalSummaryBadge" data-i18n="modelDownload.optionalBadge">可选</span>
        <span class="summary-status" id="optionalSummaryStatus"></span>
        <span class="summary-chevron" aria-hidden="true">▾</span>
      </summary>

      <div class="model-card sifigan-card" id="sifiganCard" data-group-id="sifigan-vocoder">
        <div class="model-card-header">
          <div class="model-card-title">
            <span class="model-card-name" data-i18n="modelDownload.sifiganTitle">SiFiGAN Vocoder（可选）</span>
            <span class="model-card-badge optional" data-i18n="modelDownload.optionalBadge">可选</span>
          </div>
          <div class="model-card-actions">
            <button class="btn-card btn-download" id="sifiganDownloadBtn" data-i18n="modelDownload.download">下载</button>
            <button class="btn-card btn-unload" id="sifiganUnloadBtn" style="display:none;" data-i18n="modelDownload.unload">卸载</button>
          </div>
        </div>
        <p class="model-card-desc" data-i18n="modelDownload.sifiganDesc">可选替代声码器，基于 Source-Filter HiFi-GAN，需手动下载</p>

        <div class="model-card-files">
          <div class="model-card-file">
            <span class="model-card-file-name">sifigan_vocoder_dml.onnx</span>
            <span class="model-card-file-size">~611 MB</span>
          </div>
          <div class="model-card-file">
            <span class="model-card-file-name">sifigan_stats.joblib</span>
            <span class="model-card-file-size">~2.5 KB</span>
          </div>
        </div>

        <div class="model-card-status" id="sifiganStatus">
          <span class="status-indicator" id="sifiganStatusIndicator"></span>
          <span class="status-text" id="sifiganStatusText" data-i18n="modelDownload.checking">检测中...</span>
          <span class="status-version" id="sifiganVersionText"></span>
          <button class="btn-card btn-update-sifigan" id="sifiganUpdateBtn" style="display:none;" data-i18n="modelDownload.update">更新</button>
        </div>

        <div class="model-card-tooltip" id="sifiganTooltip" style="display:none;" role="tooltip"></div>

        <div class="model-card-progress" id="sifiganProgress" style="display:none;">
          <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar-fill" id="sifiganProgressBar"></div>
          </div>
          <span class="progress-text" id="sifiganProgressText"></span>
        </div>
      </div>
    </details>
  </div>

  <div class="actions">
    <button class="btn btn-start" id="startBtn" style="display:none;" data-i18n="modelDownload.startDownload">开始下载</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;" data-i18n="modelDownload.cancelDownload">取消下载</button>
    <button class="btn btn-close" id="closeBtn" style="display:none;" data-i18n="modelDownload.close">关闭</button>
  </div>


</body>
</html>
