<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="modelDownload.title">模型文件下载</title>
  <script src="./themes/themeBootstrap.js"></script>
</head>
<body>
  <div class="header">
    <h1 data-i18n="modelDownload.title">SXSEditor 模型文件下载</h1>
    <p id="statusText" data-i18n="modelDownload.detecting">正在检测模型文件...</p>
  </div>

  <div class="precision-section" id="precisionSection" style="display:none;">
    <label class="precision-label" data-i18n="modelDownload.precisionLabel">模型精度</label>
    <div class="precision-options">
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="fp16" checked>
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionFp16">FP16 (半精度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionFp16Desc">音质最佳，显存占用较大，推荐独显用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="fp32">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionFp32">FP32 (全精度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionFp32Desc">最高精度，音质最好，显存占用最大，推荐高性能独显用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="fp8">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionFp8">FP8 (8 位浮点)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionFp8Desc">接近 FP16 音质，模型体积更小，支持 FP8 的显卡可获得更好性能</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="int8">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionInt8">INT8 (量化)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionInt8Desc">音质略有损失，显存占用更小，推荐核显或低显存用户使用</span>
        </span>
      </label>
      <label class="precision-option">
        <input type="radio" name="modelPrecision" value="int8-npu">
        <span class="precision-radio"></span>
        <span class="precision-text">
          <span class="precision-name" data-i18n="modelDownload.precisionInt8Npu">INT8-NPU (NPU 优化动态维度)</span>
          <span class="precision-desc" data-i18n="modelDownload.precisionInt8NpuDesc">动态维度模型，支持 NPU 自定义 batch size，推荐 NPU 用户使用</span>
        </span>
      </label>
    </div>
  </div>

  <div class="overall-progress" id="progressSection" style="display:none;">
    <div class="label">
      <span id="overallLabel" data-i18n="modelDownload.overallProgress">总进度</span>
      <span id="overallPercent">0%</span>
    </div>
    <div class="progress-bar-bg" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar-fill" id="overallBar"></div>
    </div>
  </div>

  <div class="dir-info" id="dirInfo" style="display:none;">
    <span class="dir-label" data-i18n="modelDownload.downloadLocation">下载位置:</span>
    <span class="dir-path" id="dirPath"></span>
    <button class="btn-change-dir" id="changeDirBtn" data-i18n="modelDownload.change">更换</button>
  </div>

  <div class="speed-info" id="speedInfo"></div>

  <div class="file-list" id="fileList"></div>

  <div class="error-message" id="errorMessage"></div>

  <div class="actions">
    <button class="btn btn-start" id="startBtn" style="display:none;" data-i18n="modelDownload.startDownload">开始下载</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;" data-i18n="modelDownload.cancelDownload">取消下载</button>
    <button class="btn btn-close" id="closeBtn" style="display:none;" data-i18n="modelDownload.close">关闭</button>
  </div>


</body>
</html>
