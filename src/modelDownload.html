<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型文件下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 24px;
      overflow: hidden;
      user-select: none;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 12px;
      color: #888;
    }
    .overall-progress {
      margin-bottom: 16px;
    }
    .overall-progress .label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #aaa;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #818cf8);
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .file-list {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 16px;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 8px;
    }
    .file-list::-webkit-scrollbar {
      width: 6px;
    }
    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .file-list::-webkit-scrollbar-thumb {
      background: #3a3a5a;
      border-radius: 3px;
    }
    .file-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 2px;
      font-size: 12px;
    }
    .file-item.downloading {
      background: rgba(99, 102, 241, 0.1);
    }
    .file-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .file-icon.pending { color: #555; }
    .file-icon.downloading { color: #6366f1; }
    .file-icon.complete { color: #22c55e; }
    .file-icon.error { color: #ef4444; }
    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ccc;
    }
    .file-status {
      margin-left: 8px;
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
      min-width: 80px;
      text-align: right;
    }
    .file-status.complete { color: #22c55e; }
    .file-status.error { color: #ef4444; }
    .file-status.downloading { color: #818cf8; }
    .dir-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #2a2a4a;
      border-radius: 6px;
      font-size: 12px;
    }
    .dir-info .dir-label {
      color: #888;
      flex-shrink: 0;
    }
    .dir-info .dir-path {
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dir-info .btn-change-dir {
      padding: 4px 12px;
      background: #3a3a5a;
      color: #aaa;
      border: 1px solid #4a4a6a;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .dir-info .btn-change-dir:hover {
      background: #4a4a6a;
      color: #fff;
    }
    .dir-info .btn-change-dir:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .speed-info {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      padding: 8px 24px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background: #6366f1;
      color: #fff;
    }
    .btn-start:hover {
      background: #818cf8;
    }
    .btn-cancel {
      background: #2a2a4a;
      color: #aaa;
      border: 1px solid #3a3a5a;
    }
    .btn-cancel:hover {
      background: #3a3a5a;
      color: #fff;
    }
    .btn-close {
      background: #6366f1;
      color: #fff;
    }
    .btn-close:hover {
      background: #818cf8;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-message {
      color: #ef4444;
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 4px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SXSEditor 模型文件下载</h1>
    <p id="statusText">正在检测模型文件...</p>
  </div>

  <div class="overall-progress" id="progressSection" style="display:none;">
    <div class="label">
      <span id="overallLabel">总进度</span>
      <span id="overallPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="overallBar"></div>
    </div>
  </div>

  <div class="dir-info" id="dirInfo" style="display:none;">
    <span class="dir-label">下载位置:</span>
    <span class="dir-path" id="dirPath"></span>
    <button class="btn-change-dir" id="changeDirBtn">更换</button>
  </div>

  <div class="speed-info" id="speedInfo"></div>

  <div class="file-list" id="fileList"></div>

  <div class="error-message" id="errorMessage"></div>

  <div class="actions">
    <button class="btn btn-start" id="startBtn" style="display:none;">开始下载</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;">取消下载</button>
    <button class="btn btn-close" id="closeBtn" style="display:none;">关闭</button>
  </div>

  <script src="./modelDownload.js"></script>
</body>
</html>
