<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="modelDownload.title">模型文件下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #14141f;
      color: #d8d8ec;
      padding: 24px;
      overflow: hidden;
      user-select: none;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e0e0f0;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 12px;
      color: #6a6a86;
    }
    .overall-progress {
      margin-bottom: 16px;
    }
    .overall-progress .label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #8888a8;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #2a2a3d;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #5b8def, #6b9df5);
      border-radius: 4px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .file-list {
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 16px;
      border: 1px solid #2a2a3d;
      border-radius: 8px;
      padding: 8px;
    }
    .file-list::-webkit-scrollbar {
      width: 6px;
    }
    .file-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .file-list::-webkit-scrollbar-thumb {
      background: #3a3a52;
      border-radius: 3px;
    }
    .file-item {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 2px;
      font-size: 12px;
    }
    .file-item.downloading {
      background: rgba(91, 141, 239, 0.08);
    }
    .file-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .file-icon.pending { color: #4a4a66; }
    .file-icon.downloading { color: #5b8def; }
    .file-icon.complete { color: #4ade80; }
    .file-icon.error { color: #f87171; }
    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #c8c8dc;
    }
    .file-status {
      margin-left: 8px;
      font-size: 11px;
      color: #6a6a86;
      flex-shrink: 0;
      min-width: 80px;
      text-align: right;
    }
    .file-status.complete { color: #4ade80; }
    .file-status.error { color: #f87171; }
    .file-status.downloading { color: #6b9df5; }
    .dir-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #1a1a2a;
      border-radius: 6px;
      border: 1px solid #2a2a3d;
      font-size: 12px;
    }
    .dir-info .dir-label {
      color: #6a6a86;
      flex-shrink: 0;
    }
    .dir-info .dir-path {
      color: #c8c8dc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dir-info .btn-change-dir {
      padding: 4px 12px;
      background: linear-gradient(180deg, #3a3a4e, #323246);
      color: #a8a8c0;
      border: 1px solid #4a4a62;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .dir-info .btn-change-dir:hover {
      background: linear-gradient(180deg, #484860, #3e3e56);
      color: #e0e0f0;
      border-color: #5a5a72;
    }
    .dir-info .btn-change-dir:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .speed-info {
      text-align: center;
      font-size: 11px;
      color: #4a4a66;
      margin-bottom: 12px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      padding: 8px 24px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-start {
      background: linear-gradient(135deg, #5b8def, #4a7de0);
      color: #fff;
      box-shadow: 0 2px 8px rgba(91, 141, 239, 0.25);
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #6b9df5, #5b8def);
      box-shadow: 0 4px 12px rgba(91, 141, 239, 0.35);
    }
    .btn-cancel {
      background: #3a3a52;
      color: #a8a8c0;
      border: 1px solid #4a4a62;
    }
    .btn-cancel:hover {
      background: #4a4a62;
      color: #e0e0f0;
    }
    .btn-close {
      background: linear-gradient(135deg, #5b8def, #4a7de0);
      color: #fff;
      box-shadow: 0 2px 8px rgba(91, 141, 239, 0.25);
    }
    .btn-close:hover {
      background: linear-gradient(135deg, #6b9df5, #5b8def);
      box-shadow: 0 4px 12px rgba(91, 141, 239, 0.35);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .error-message {
      color: #f87171;
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(91, 141, 239, 0.2);
      border-top-color: #5b8def;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 4px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 data-i18n="modelDownload.title">SXSEditor 模型文件下载</h1>
    <p id="statusText" data-i18n="modelDownload.detecting">正在检测模型文件...</p>
  </div>

  <div class="overall-progress" id="progressSection" style="display:none;">
    <div class="label">
      <span id="overallLabel" data-i18n="modelDownload.overallProgress">总进度</span>
      <span id="overallPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="overallBar"></div>
    </div>
  </div>

  <div class="dir-info" id="dirInfo" style="display:none;">
    <span class="dir-label" data-i18n="modelDownload.downloadLocation">下载位置:</span>
    <span class="dir-path" id="dirPath"></span>
    <button class="btn-change-dir" id="changeDirBtn" data-i18n="modelDownload.change">更换</button>
  </div>

  <div class="speed-info" id="speedInfo"></div>

  <div class="file-list" id="fileList"></div>

  <div class="error-message" id="errorMessage"></div>

  <div class="actions">
    <button class="btn btn-start" id="startBtn" style="display:none;" data-i18n="modelDownload.startDownload">开始下载</button>
    <button class="btn btn-cancel" id="cancelBtn" style="display:none;" data-i18n="modelDownload.cancelDownload">取消下载</button>
    <button class="btn btn-close" id="closeBtn" style="display:none;" data-i18n="modelDownload.close">关闭</button>
  </div>


</body>
</html>
