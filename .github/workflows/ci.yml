name: CI

on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  INSTALLER_NAME: sxsinstaller_x64_no_models.exe

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  build-and-release:
    name: Build and Release (${{ github.ref_name }})
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Determine version and tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +%Y%m%d)
          if [ "$BRANCH" = "release" ]; then
            # Query latest EA release for last version number (not committed; no conflicts on PR)
            LAST_VERSION=""
            if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/EA" > /tmp/ea_release.json 2>/dev/null; then
              LAST_VERSION=$(node -e "const fs=require('fs');try{const r=JSON.parse(fs.readFileSync('/tmp/ea_release.json','utf8'));console.log(r.name||'')}catch{console.log('')}")
            fi
            if [ -z "$LAST_VERSION" ]; then
              LAST_VERSION=$(node -p "require('./package.json').version")
              echo "[ci] No previous EA release found, using package.json version: $LAST_VERSION"
            else
              echo "[ci] Last EA release version: $LAST_VERSION"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            TAG="EA"
            PRERELEASE="false"
            IS_RELEASE="true"
            MAKE_LATEST="true"
          else
            NEW_VERSION="nightly_${DATE}_${SHORT_SHA}"
            TAG="nightly"
            PRERELEASE="true"
            IS_RELEASE="false"
            MAKE_LATEST="false"
          fi
          # Write version to package.json (NOT committed; only for this build)
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.argv[1]; fs.writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')" "$NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "make_latest=$MAKE_LATEST" >> $GITHUB_OUTPUT
          echo "[ci] branch=$BRANCH version=$NEW_VERSION tag=$TAG prerelease=$PRERELEASE make_latest=$MAKE_LATEST"

      - name: Install dependencies
        run: npm ci

      - name: Build lite package
        run: npm run package:lite
        env:
          SKIP_ONNX_MODELS: 1
          DEBUG: electron-forge:*

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== out/ directory tree (depth 1) ==="
          if (Test-Path out) {
            Get-ChildItem -Recurse out -Depth 1 | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Error "out/ directory does not exist!"
            exit 1
          }
          $exe = "out\SXSEditor-win32-x64\SXSEditor.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "SXSEditor.exe not found at $exe"
            Write-Host "=== Contents of out/SXSEditor-win32-x64/ ==="
            if (Test-Path "out\SXSEditor-win32-x64") {
              Get-ChildItem "out\SXSEditor-win32-x64" | Select-Object Name, Length | Format-Table -AutoSize
            }
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "Build output verified: $exe ($size bytes)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $existing = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $existing) {
            Write-Host "Inno Setup 6 already installed"
            return
          }
          choco install innosetup -y --no-progress --force

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          Write-Host "Using ISCC: $isccPath"
          & $isccPath "/DMyAppVersion=$version" "inno/no_onnx.iss"
          $installer = "inno\$env:INSTALLER_NAME"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            exit 1
          }
          Write-Host "Installer built: $installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxsinstaller-${{ github.ref_name }}
          path: inno/${{ env.INSTALLER_NAME }}
          retention-days: 30

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## SXSEditor ${{ steps.version.outputs.version }}

            - **Branch**: ${{ steps.version.outputs.branch }}
            - **Commit**: ${{ github.sha }}
            - **Tag**: ${{ steps.version.outputs.tag }}
            - **Prerelease**: ${{ steps.version.outputs.prerelease == 'true' && 'Yes' || 'No' }}

            ### Install

            Download `sxsinstaller_x64_no_models.exe` below and run it.
            ONNX models are auto-downloaded on first launch.

            ### Direct download (always points to latest)

            - GitHub: https://github.com/Henley04/SXSEditor/releases/latest/download/sxsinstaller_x64_no_models.exe
            - GitCode mirror: https://gitcode.com/qq_50331623/SXSEditor/releases/latest/download/sxsinstaller_x64_no_models.exe
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          files: inno/${{ env.INSTALLER_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
