name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: dist/make/deb/x64/*.deb
          - os: windows-latest
            artifact: dist/make/squirrel.windows/x64/*.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build lite package
        run: npm run package:lite

      - name: Create distributable
        run: npm run make
        env:
          SKIP_ONNX_MODELS: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxseditor-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          retention-days: 30
