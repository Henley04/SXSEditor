name: CI

on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  INSTALLER_NAME: sxsinstaller_x64_no_models.exe

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build native ORT bridge for Electron
        run: npm run build:native

      - name: Sync fresh build to prebuilt directory
        shell: pwsh
        run: |
          Copy-Item -Force "native\ort-bridge\build\Release\ort_bridge.node" "native\ort-bridge\prebuilt\win32-x64\ort_bridge.node"
          $bytes = [System.IO.File]::ReadAllBytes("native\ort-bridge\prebuilt\win32-x64\ort_bridge.node")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains("d2h-copy-v2")) { throw "prebuilt addon missing d2h-copy-v2 marker" }
          Write-Host "prebuilt synced and verified"

      - name: Run tests (skip network & model loading/inference)
        run: npm run test:ci

  build-and-release:
    name: Build and Release (${{ github.ref_name }})
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so git tags are available for version bumping
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine version and tag
        id: version
        shell: bash
        run: |
          BRANCH="${GITHUB_REF##*/}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE=$(date -u +%Y%m%d)
          if [ "$BRANCH" = "release" ]; then
            # Tag is the semver X.Y.Z itself. Find the highest existing semver
            # git tag and bump the patch component. Git tags are the source of
            # truth (more reliable than the releases API which can be delayed,
            # paginated, or silently fail on auth errors).
            echo "[ci] Listing all semver tags..."
            git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 20
            LAST_VERSION=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            if [ -z "$LAST_VERSION" ]; then
              LAST_VERSION=$(node -p "require('./package.json').version")
              echo "[ci] No previous semver tag found, using package.json version: $LAST_VERSION"
            else
              echo "[ci] Last semver tag: $LAST_VERSION"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BUILD_VERSION="$NEW_VERSION"
            TAG="$NEW_VERSION"
            PRERELEASE="false"
            IS_RELEASE="true"
            MAKE_LATEST="true"
          else
            # Display version stays descriptive for the release name/body;
            # BUILD_VERSION must be numeric (X.Y.Z.W) because Windows resedit
            # (@electron/packager) requires integer version components.
            NEW_VERSION="nightly_${DATE}_${SHORT_SHA}"
            BUILD_VERSION="1.0.0.${{ github.run_number }}"
            TAG="nightly"
            PRERELEASE="true"
            IS_RELEASE="false"
            MAKE_LATEST="false"
          fi
          # Write BUILD_VERSION to package.json (NOT committed; only for this build).
          # resedit rejects non-integer components like "nightly_20260630_abc1234".
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version=process.argv[1]; fs.writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n')" "$BUILD_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "make_latest=$MAKE_LATEST" >> $GITHUB_OUTPUT
          echo "[ci] branch=$BRANCH version=$NEW_VERSION build_version=$BUILD_VERSION tag=$TAG prerelease=$PRERELEASE make_latest=$MAKE_LATEST"

      - name: Install dependencies
        run: npm ci
        env:
          # Ensure Electron binary downloads even if postinstall was silently skipped
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'

      - name: Build native ORT bridge for Electron
        run: npm run build:native

      - name: Sync fresh build to prebuilt directory
        shell: pwsh
        run: |
          Copy-Item -Force "native\ort-bridge\build\Release\ort_bridge.node" "native\ort-bridge\prebuilt\win32-x64\ort_bridge.node"
          $bytes = [System.IO.File]::ReadAllBytes("native\ort-bridge\prebuilt\win32-x64\ort_bridge.node")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains("d2h-copy-v2")) { throw "prebuilt addon missing d2h-copy-v2 marker" }
          Write-Host "prebuilt synced and verified"

      - name: Ensure Electron binary and zip cache
        shell: pwsh
        run: |
          $electronExe = "node_modules\electron\dist\electron.exe"
          $electronVersion = "42.4.1"
          $cacheDir = "$env:LOCALAPPDATA\electron\Cache"
          $zipName = "electron-v$electronVersion-win32-x64.zip"

          Write-Host "=== Checking Electron binary ==="
          if (-not (Test-Path $electronExe)) {
            Write-Host "Electron binary missing, running install script..."
            node node_modules/electron/install.js
            if (-not (Test-Path $electronExe)) {
              Write-Host "Default source failed, trying npmmirror..."
              $env:ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"
              node node_modules/electron/install.js
            }
            if (-not (Test-Path $electronExe)) {
              Write-Error "Failed to download Electron binary!"
              exit 1
            }
          }
          $size = (Get-Item $electronExe).Length
          Write-Host "Electron binary OK: $electronExe ($size bytes)"

          Write-Host "=== Checking Electron zip cache (needed by electron-packager) ==="
          Write-Host "Cache dir: $cacheDir"
          # @electron/get stores zips under Cache/<hash>/<zipName>, so search recursively.
          $existingZip = $null
          if (Test-Path $cacheDir) {
            $existingZip = Get-ChildItem $cacheDir -Recurse -Filter $zipName -File -ErrorAction SilentlyContinue | Select-Object -First 1
            Get-ChildItem $cacheDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Cache dir does not exist"
          }

          if (-not $existingZip) {
            Write-Host "Electron zip not in cache, downloading via @electron/get..."
            $downloadResult = node -e "const get = require('@electron/get'); get.downloadArtifact({ version: '$electronVersion', platform: 'win32', arch: 'x64', artifactName: 'electron' }).then(p => console.log(p)).catch(e => { console.error(e); process.exit(1); })"
            Write-Host "cached at: $downloadResult"
            if (Test-Path $cacheDir) {
              Write-Host "=== Cache contents after download ==="
              Get-ChildItem $cacheDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            }
          } else {
            Write-Host "Electron zip already cached: $($existingZip.FullName) ($($existingZip.Length) bytes)"
          }

      - name: Verify environment before build
        shell: pwsh
        run: |
          Write-Host "=== Node/npm versions ==="
          node --version
          npm --version
          Write-Host "=== Forge config check ==="
          node -e "try { require('./forge.config.js'); console.log('forge.config.js OK'); } catch(e) { console.error('forge.config.js ERROR:', e.message); }"
          Write-Host "=== Pre-generate build-info.json ==="
          node scripts/generate-build-info.js

      - name: Build lite package
        shell: pwsh
        run: |
          $env:SKIP_ONNX_MODELS = "1"
          $env:DEBUG = "electron-forge:*"
          Write-Host "=== Running electron-forge package ==="
          & npm run package:lite 2>&1 | Tee-Object -FilePath build-output.log
          $exitCode = $LASTEXITCODE
          Write-Host "Build exit code: $exitCode"
          Write-Host "=== .webpack/ directory check ==="
          if (Test-Path ".webpack") {
            Get-ChildItem -Recurse ".webpack" -Depth 1 | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host ".webpack/ does not exist - webpack compilation failed!"
          }
          Write-Host "=== out/ directory check ==="
          if (Test-Path "out") {
            Get-ChildItem -Recurse "out" -Depth 1 | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "out/ does not exist after forge - trying @electron/packager API directly..."
            $env:ELECTRON_CACHE = "$env:LOCALAPPDATA\electron\Cache"
            Write-Host "ELECTRON_CACHE: $env:ELECTRON_CACHE"
            & node scripts/run-packager.js 2>&1 | Tee-Object -FilePath build-output.log -Append
            $packagerExit = $LASTEXITCODE
            Write-Host "Direct packager exit code: $packagerExit"
            if (Test-Path "out") {
              Get-ChildItem -Recurse "out" -Depth 1 | Select-Object FullName, Length | Format-Table -AutoSize
            } else {
              Write-Host "out/ STILL does not exist!"
              Write-Host "=== Searching for SXSEditor.exe in workspace ==="
              Get-ChildItem -Path "." -Filter "SXSEditor.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            }
          }

      - name: Verify packaged native ORT bridge
        shell: pwsh
        run: |
          $addons = Get-ChildItem -Path ".webpack", "out" -Filter "ort_bridge*.node" -Recurse -ErrorAction SilentlyContinue
          if (-not $addons) { throw "Packaged application does not contain ort_bridge.node" }
          foreach ($addon in $addons) {
            Write-Host "Native addon: $($addon.FullName) ($($addon.Length) bytes)"
            $bytes = [System.IO.File]::ReadAllBytes($addon.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text.Contains("d2h-copy-v2")) {
              Write-Host "  OK: contains d2h-copy-v2" -ForegroundColor Green
            } else {
              throw "Packaged addon is legacy: $($addon.FullName)"
            }
          }

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "out\SXSEditor-win32-x64\SXSEditor.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "SXSEditor.exe not found at $exe"
            if (Test-Path "out\SXSEditor-win32-x64") {
              Write-Host "=== Contents of out/SXSEditor-win32-x64/ ==="
              Get-ChildItem "out\SXSEditor-win32-x64" | Select-Object Name, Length | Format-Table -AutoSize
            }
            # Print full build log for debugging
            Write-Host "=== Full build-output.log ==="
            if (Test-Path build-output.log) {
              Get-Content build-output.log
            }
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "Build output verified: $exe ($size bytes)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.ref_name }}
          path: build-output.log
          retention-days: 7

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $existing = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $existing) {
            Write-Host "Inno Setup 6 already installed"
            return
          }
          choco install innosetup -y --no-progress --force

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          # Inno Setup / Windows expects a numeric X.Y.Z[.W] version.
          $version = "${{ steps.version.outputs.build_version }}"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $isccPath = $iscc.Source
          }
          Write-Host "Using ISCC: $isccPath"
          & $isccPath "/DMyAppVersion=$version" "inno/no_onnx.iss"
          $installer = "inno\$env:INSTALLER_NAME"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            exit 1
          }
          Write-Host "Installer built: $installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sxsinstaller-${{ github.ref_name }}
          path: inno/${{ env.INSTALLER_NAME }}
          retention-days: 30

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          body: |
            ## SXSEditor ${{ steps.version.outputs.version }}

            - **Branch**: ${{ steps.version.outputs.branch }}
            - **Commit**: ${{ github.sha }}
            - **Tag**: ${{ steps.version.outputs.tag }}
            - **Prerelease**: ${{ steps.version.outputs.prerelease == 'true' && 'Yes' || 'No' }}

            ### Install

            Download `sxsinstaller_x64_no_models.exe` below and run it.
            ONNX models are auto-downloaded on first launch.

            ### Direct download

            - GitHub: ${{ steps.version.outputs.is_release == 'true' && 'https://github.com/Henley04/SXSEditor/releases/latest/download/sxsinstaller_x64_no_models.exe' || format('https://github.com/Henley04/SXSEditor/releases/download/{0}/sxsinstaller_x64_no_models.exe', steps.version.outputs.tag) }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          files: inno/${{ env.INSTALLER_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
